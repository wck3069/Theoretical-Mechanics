<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>勒让德变换与罗斯约化 · 理论力学</title><style>body{max-width:760px;margin:0 auto;padding:32px 22px;background:#070b16;color:#dce6ff;font-family:ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;line-height:1.8}h1{font-size:24px}code{background:rgba(127,224,255,.10);padding:2px 6px;border-radius:5px}a{color:#7fe0ff}.eq{border:1px solid rgba(120,165,255,.18);border-radius:10px;padding:14px;background:rgba(10,16,32,.65);font-family:ui-monospace,monospace}</style></head><body><h1>勒让德变换与罗斯约化</h1><p class="eq">H = p q̇ − L</p><p>手稿 ch06.tex:9。把速度变量经勒让德变换换成正则动量：H = p q̇ − L，由 dH = q̇ dp − (∂L/∂q)dq 推出正则方程 q̇ = ∂H/∂p、ṗ = −∂H/∂q；罗斯约化再固定循环动量。</p><p><a href="./index.html">← 回到交互模拟</a> · <a href="../../chapters/06-hamiltonian/manuscripts/book.html">← 回到第 6 章书稿</a></p></body></html>
