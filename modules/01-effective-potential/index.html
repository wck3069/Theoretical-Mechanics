<!DOCTYPE html>
<!-- ============================================================
  理论力学 · 交互讲义 —— index.html 模板（P0-T2）
  由 tools/new_module.py 复制到模块目录并替换占位符：
    有效势与轨道稳定性  模块标题    01-effective-potential  模块代号
  硬性约束（tools/check_html.py 强制检查）：
    - 单文件、零外部依赖：不得引用任何外部 URL、CDN、网络字体；
    - 不得发起网络请求或动态加载外部模块；数据一律内联；
    - 内联 JS 限用 esprima 4.0.1 可解析的语法（ES2017 及以下，
      不用可选链、空值合并等新语法；见 qa/global/toolchain.md）。
  实现模块时的 TODO 清单（见文末 <script> 头部）：
    1) PARAMS 参数定义  2) PRESETS URL 预设  3) step 物理积分
    4) render 绘制/HUD  5) SELFTEST 断言（?selftest=1，§5.4）
  ============================================================ -->
<!-- allow: SIZE_OK — 单文件约束（PLAN.md §4.2）：CSS/JS 必须内联，无法拆分 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有效势与轨道稳定性 · 交互实验</title>
<style>
  :root{
    --bg:#05070f; --panel:rgba(18,24,42,.82); --line:rgba(120,160,255,.14);
    --text:#dbe4ff; --muted:#8a98c0; --accent:#5ea2ff; --accent2:#ffcf6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 800px at 70% 10%,#0b1226 0%,#05070f 55%,#02030a 100%);
    color:var(--text); font-family:ui-sans-serif,system-ui,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  .app{display:flex; height:100vh; width:100vw}
  .stage{position:relative; flex:1; min-width:0}
  canvas{display:block; width:100%; height:100%; touch-action:none}
  .brand{position:absolute; top:22px; left:26px; pointer-events:none}
  .brand h1{margin:0; font-size:19px; letter-spacing:.5px; font-weight:650}
  .brand p{margin:5px 0 0; font-size:12.5px; color:var(--muted)}
  .hud{position:absolute; left:26px; bottom:22px; font-size:12.5px; color:var(--muted);
       display:flex; gap:18px; flex-wrap:wrap; pointer-events:none}
  .hud b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}

  .panel{
    width:340px; flex:none; padding:22px 22px 18px; overflow-y:auto;
    background:var(--panel); border-left:1px solid var(--line);
  }
  .panel::-webkit-scrollbar{width:8px} .panel::-webkit-scrollbar-thumb{background:#2a3760;border-radius:4px}
  .eq{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13.5px; line-height:1.9;
    padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    background:rgba(10,16,32,.6); color:#cfe0ff; margin-bottom:20px;
  }
  .eq .num{color:var(--accent2)}
  .group{margin-bottom:17px}
  .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px}
  .row label{font-size:13px; color:#b9c6ea}
  .row .val{font-family:ui-monospace,monospace; font-size:13px; color:var(--accent2); font-variant-numeric:tabular-nums}
  input[type=range]{width:100%; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
    background:linear-gradient(90deg,#3a5fbf,#1a2440); outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--accent); border:2px solid #0a1020; box-shadow:0 0 10px rgba(94,162,255,.7); cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px; height:13px; border-radius:50%; background:var(--accent);
    border:2px solid #0a1020; cursor:pointer}
  .hint{font-size:11.5px; color:#6d7ba3; margin-top:5px; line-height:1.5}

  .btns{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:6px}
  button{
    font:inherit; font-size:12.5px; padding:9px 10px; border-radius:9px; cursor:pointer;
    color:#cfdcff; background:rgba(58,95,191,.18); border:1px solid rgba(94,162,255,.35);
    transition:.15s;
  }
  button:hover{background:rgba(94,162,255,.28)}
  button.primary{background:linear-gradient(180deg,#3f7bff,#2b5fe0); border-color:#4f86ff; color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  .full{grid-column:1/-1}
  a.doc{display:inline-block; margin-top:16px; font-size:12.5px; color:var(--accent); text-decoration:none}
  a.doc:hover{text-decoration:underline}
  details.mapping{margin-top:14px; font-size:12.5px; color:var(--muted)}
  details.mapping summary{cursor:pointer; color:#b9c6ea}
  details.mapping table{width:100%; border-collapse:collapse; margin-top:8px; font-size:11.5px}
  details.mapping th, details.mapping td{padding:4px 6px; border:1px solid var(--line); text-align:left; color:var(--muted)}
  .tag{display:inline-block; margin-top:14px; font-size:11.5px; color:var(--muted)}
  .tag span{color:var(--accent2)}

  .selftest{position:absolute; top:16px; right:16px; max-width:70%; z-index:999; padding:12px 16px;
    border-radius:10px; background:rgba(10,26,14,.94); border:1px solid #2f6b3f; color:#cfe9d0;
    font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap}
  .selftest.fail{background:rgba(60,10,16,.95); border-color:#a33; color:#ffd7d7}
  .selftest h2{margin:0 0 6px; font-size:13px; color:#9fe8b0}
  .selftest.fail h2{color:#ffb3b3}

  @media (max-width:820px){
    .app{flex-direction:column}
    .panel{width:100%; height:46vh; border-left:none; border-top:1px solid var(--line)}
    .stage{height:54vh}
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="stage-canvas"></canvas>
    <noscript><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd7d7;font-size:14px">需要启用 JavaScript 才能显示实验画面</div></noscript>
    <div class="brand">
      <h1>有效势与轨道稳定性</h1>
      <p>模板占位副标题：一句话说明本实验做什么（TODO 替换）</p>
    </div>
    <div class="hud">
      <span>占位量 q₁ <b id="hudQ1">–</b></span>
      <span>占位量 q₂ <b id="hudQ2">–</b></span>
      <span>状态 <b id="hudState">运行中</b></span>
    </div>
    <div id="selftestPanel" class="selftest" hidden></div>
  </div>

  <aside class="panel">
    <div class="eq">
      占位方程：d²x/dt² = f(x; <span class="num">a</span>, <span class="num">b</span>)
    </div>

    <div class="group">
      <div class="row"><label for="param-a">占位参数 a</label><span class="val" id="val-a">1.00</span></div>
      <input type="range" id="param-a" min="0.1" max="3" step="0.01" value="1" aria-label="占位参数 a">
      <div class="hint">TODO：写明 a 的物理含义、单位与对结果的影响。</div>
    </div>

    <div class="group">
      <div class="row"><label for="param-b">占位参数 b</label><span class="val" id="val-b">0.50</span></div>
      <input type="range" id="param-b" min="0" max="2" step="0.01" value="0.5" aria-label="占位参数 b">
      <div class="hint">TODO：写明 b 的物理含义。</div>
    </div>

    <div class="group">
      <div class="row"><label for="param-speed">动画速度</label><span class="val" id="val-speed">1.0×</span></div>
      <input type="range" id="param-speed" min="0.1" max="3" step="0.1" value="1" aria-label="动画速度">
    </div>

    <div class="btns">
      <button id="btn-pause" class="primary">暂停</button>
      <button id="btn-reset">重置</button>
      <button id="btn-preset" class="full">预设：默认（preset=default）</button>
    </div>

    <details class="mapping" id="mapping">
      <summary>作业映射（TODO：链接到具体作业题）</summary>
      <table>
        <tr><th>来源</th><th>题目</th><th>知识点</th></tr>
        <tr><td>作业-N QM</td><td>（题面简述）</td><td>（知识点）</td></tr>
        <tr><td>作业-N QM</td><td>（题面简述）</td><td>（知识点）</td></tr>
      </table>
    </details>

    <a class="doc" href="note.pdf" target="_blank">📄 查看推导文档（note.pdf）</a>
    <div class="tag">数值方法：占位（建议四阶 Runge–Kutta）· 单位制：占位 · 已知限制：占位（TODO 按 §5.2 页脚要求替换）</div>
  </aside>
</div>

<script>
/* ============================================================
 * 有效势与轨道稳定性（01-effective-potential）—— 交互实验模板
 * TODO 清单（实现模块时逐项替换）：
 *   1. PARAMS   参数定义（默认值 / 范围 / HUD 格式 / 物理提示）
 *   2. PRESETS  URL 预设（?preset=...，§4.2 要求至少一个）
 *   3. step()   物理积分（建议 RK4，§5.3；须监控守恒量漂移）
 *   4. render() 绘制与 HUD 更新（单位必须写清）
 *   5. SELFTEST ?selftest=1 断言（§5.4：至少 3 条，FAIL 须显示
 *      期望值、实际值、相对误差）
 * 约束：单文件、零外部依赖；不得发起网络请求或加载外部模块
 * （tools/check_html.py 强制检查）。
 * ============================================================ */
(() => {
  'use strict';

  window.addEventListener('error', (e) => {
    try {
      let d = document.getElementById('errbox');
      if (!d) {
        d = document.createElement('div');
        d.id = 'errbox';
        d.style.cssText = 'position:fixed;left:16px;bottom:16px;max-width:70vw;z-index:9999;padding:10px 12px;border-radius:8px;background:rgba(80,10,20,.95);border:1px solid #b44;color:#ffd7d7;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap';
        document.body.appendChild(d);
      }
      d.textContent = '脚本错误：' + (e.message || e.error);
    } catch (_) {}
  });

  const cvs = document.getElementById('stage-canvas');
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  /* ---------- 1. 参数定义（TODO：替换为本模块参数） ---------- */
  const PARAMS = {
    a:     { def: 1.0, fmt: (v) => v.toFixed(2), hint: '占位参数 a' },
    b:     { def: 0.5, fmt: (v) => v.toFixed(2), hint: '占位参数 b' },
    speed: { def: 1.0, fmt: (v) => v.toFixed(1) + '×', hint: '动画速度' }
  };
  const state = {};
  for (const k in PARAMS) state[k] = PARAMS[k].def;
  state.paused = false;

  /* ---------- 2. URL 预设（TODO：至少一个物理预设） ----------
   * 解析顺序：先应用 preset，再让显式参数覆盖（?preset=default&a=1.5）；
   * 非法值一律回退默认，不能白屏（§5.2）。 */
  const PRESETS = {
    default: { a: 1.0, b: 0.5 },    // 占位：默认预设
    example: { a: 2.0, b: 0.25 }    // 占位：第二预设（改名并写明物理场景）
  };

  const q = new URLSearchParams(location.search);

  function parseParam(k, raw) {
    const v = parseFloat(raw);
    return isFinite(v) ? v : PARAMS[k].def;   // 非法值回退默认
  }

  function applyPreset(name) {
    if (!PRESETS[name]) return false;         // 未知预设忽略，保持默认
    for (const k in PRESETS[name]) state[k] = PRESETS[name][k];
    return true;
  }

  if (q.has('preset')) applyPreset(q.get('preset'));
  for (const k in PARAMS) {
    if (q.has(k)) state[k] = parseParam(k, q.get(k));
  }
  if (q.get('paused') === '1') state.paused = true;

  /* ---------- 3. 占位物理：匀速圆周（TODO：替换为真实模型） ---------- */
  let phase = 0;
  function step(dt) {
    phase += dt * state.speed * (0.2 + 0.3 * state.a);   // 占位：角速度与 a 相关
  }

  /* ---------- 4. 绘制与 HUD ---------- */
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const rect = cvs.getBoundingClientRect();
    W = rect.width; H = rect.height;
    if (!(W > 0 && H > 0)) return;
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    render();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('load', resize);
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(cvs);

  function render() {
    if (!(W > 0 && H > 0)) return;
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W * 0.6, H * 0.35, 0, W * 0.6, H * 0.35, Math.max(W, H) * 0.9);
    g.addColorStop(0, '#0b1428'); g.addColorStop(0.55, '#060a16'); g.addColorStop(1, '#02030a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // 占位场景：参数驱动的圆周运动示意（TODO：替换为本模块物理场景）
    const cx = W * 0.5, cy = H * 0.5;
    const R = Math.min(W, H) * (0.12 + 0.08 * state.b);
    ctx.strokeStyle = 'rgba(120,160,255,.25)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    const x = cx + R * Math.cos(phase), y = cy + R * Math.sin(phase);
    ctx.fillStyle = '#eaf3ff';
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();

    document.getElementById('hudQ1').textContent = state.a.toFixed(2);
    document.getElementById('hudQ2').textContent = state.b.toFixed(2);
    document.getElementById('hudState').textContent = state.paused ? '已暂停' : '运行中';
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!state.paused) step(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- 5. ?selftest=1 断言框架（§5.4） ----------
   * 约定：不启动动画循环；结果写入 window.__selftest = {passed, failed, details}；
   * 页面显示可读结果面板；FAIL 必须显示期望值、实际值、相对误差。
   * TODO：把占位断言替换为本模块的物理断言（至少 3 条，§5.3）。 */
  function runSelftest() {
    const details = [];
    const assert = (name, pass, detail) => {
      details.push({ name: name, pass: !!pass, detail: detail || '' });
    };

    // 占位断言 1：非法参数回退默认（不白屏，§5.2）
    const savedA = state.a;
    state.a = parseParam('a', 'not-a-number');
    assert('非法参数回退默认值', state.a === PARAMS.a.def,
           '期望 a=' + PARAMS.a.def + '，实际 a=' + state.a);
    state.a = savedA;

    // 占位断言 2：预设存在性
    assert('预设 default 已定义', PRESETS.default !== undefined,
           '可用预设：' + Object.keys(PRESETS).join(', '));

    // 占位断言 3：语法冒烟（TODO：替换为守恒量漂移等物理断言）
    assert('占位冒烟断言 1+1=2', 1 + 1 === 2, '');

    const passed = details.filter((r) => r.pass).length;
    const failed = details.length - passed;
    window.__selftest = { passed: passed, failed: failed, details: details };

    const panel = document.getElementById('selftestPanel');
    const lines = details.map((r) =>
      (r.pass ? 'PASS ' : 'FAIL ') + r.name + (r.detail ? '  [' + r.detail + ']' : ''));
    panel.hidden = false;
    panel.className = 'selftest' + (failed ? ' fail' : '');
    panel.innerHTML = '';
    const h = document.createElement('h2');
    h.textContent = 'selftest：' + passed + ' 通过 / ' + failed + ' 失败';
    panel.appendChild(h);
    const body = document.createElement('div');
    body.textContent = lines.join('\n');
    panel.appendChild(body);
    return failed === 0;
  }

  /* ---------- 控件绑定 ---------- */
  const el = {
    a: document.getElementById('param-a'),
    b: document.getElementById('param-b'),
    speed: document.getElementById('param-speed')
  };
  const out = {
    a: document.getElementById('val-a'),
    b: document.getElementById('val-b'),
    speed: document.getElementById('val-speed')
  };
  function sync() {
    for (const k in el) {
      state[k] = parseFloat(el[k].value);
      out[k].textContent = PARAMS[k].fmt(state[k]);
    }
  }
  for (const k in el) el[k].addEventListener('input', sync);

  // 把 URL 解析结果写回滑块（刷新后状态可复现，§5.2）
  for (const k in el) el[k].value = String(state[k]);
  sync();

  document.getElementById('btn-pause').addEventListener('click', (ev) => {
    state.paused = !state.paused;
    ev.target.textContent = state.paused ? '继续' : '暂停';
    render();
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    phase = 0;
    applyPreset('default');
    for (const k in el) el[k].value = String(state[k]);
    state.paused = false;
    document.getElementById('btn-pause').textContent = '暂停';
    sync();
    render();
  });
  document.getElementById('btn-preset').addEventListener('click', () => {
    applyPreset('default');
    for (const k in el) el[k].value = String(state[k]);
    sync();
    render();
  });

  /* ---------- 启动：selftest 模式不进入动画循环（§5.4） ---------- */
  resize();
  if (q.get('selftest') === '1') {
    runSelftest();
  } else {
    requestAnimationFrame((t) => { last = t; frame(t); });
  }
})();
</script>
</body>
</html>
