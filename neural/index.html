<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识网络 · 理论力学</title>
<meta name="description" content="理论力学知识网络：以行星为入口，按章—模块—节点三层浏览公式、推导与例题。">
<style>
/* ===== 设计令牌：与 assets/design-tokens.css 对齐（深空 + 玻璃 + 星色） ===== */
:root{
  --void:#03050c; --deep:#060a17; --horizon:#0b1226;
  --panel:rgba(9,14,30,.74); --panel-solid:#080d1c;
  --line:rgba(146,182,255,.14); --line-2:rgba(176,206,255,.30);
  --text:#e8eeff; --text-2:#a9b8dc; --muted:#6d7ca4;
  --solar:#ffd27a; --cyan:#7fe0ff; --violet:#b79bff; --teal:#7ff0cf;
  --rose:#ff9fc4; --amber:#ffc46b; --coral:#ff9d6b; --ice:#9fd8ff; --lav:#c9b8ff;
  --accent:#7fe0ff;                 /* 随章节主题色覆盖 */
  --halo-sz:460px; --core-sz:150px;
  --glass:rgba(10,16,32,.62); --glass-2:rgba(12,19,38,.80);
  --radius:16px; --radius-sm:10px;
  --font-ui:ui-sans-serif,system-ui,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --dur-1:180ms; --dur-2:320ms; --dur-3:560ms; --dur-4:1100ms;
  --ease:cubic-bezier(.22,.68,.28,1); --ease-io:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--text); font-family:var(--font-ui); overflow:hidden;
  /* 深空基底：本页自绘（原生星空 #bg 画布绘制于其上），不依赖任何共享星空层 */
  background:
    radial-gradient(1100px 720px at 12% 6%,  rgba(26,58,110,.18), rgba(3,5,12,0) 62%),
    radial-gradient(920px 620px at 88% 20%,  rgba(44,90,160,.13), rgba(3,5,12,0) 58%),
    radial-gradient(1300px 900px at 50% 112%, rgba(11,29,81,.30), rgba(3,5,12,0) 60%),
    var(--void);
  color-scheme:dark;
}
/* 原生星空层：单张固定画布，位于全部内容与光球/粒子之下（z:0 < glow 1 < stage 2 < rail/topbar/notice/panel） */
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
/* 章节深空基底：命中行星后在本页基底之下铺 4K 行星/星云图（与章节门户同一美术语言，assets/img/portal），
   经 opacity 交叉淡入；两层压暗护住图谱可读性；原生星空画布（同为 z:0、DOM 在后）叠于图片之上 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  transition:opacity var(--dur-4) var(--ease-io);
  background:
    radial-gradient(140% 110% at 50% 118%, rgba(3,5,12,.72), rgba(3,5,12,0) 60%),
    linear-gradient(rgba(3,5,12,.52), rgba(3,5,12,.72)),
    var(--chapbg,#04060d) center/cover no-repeat}
body[data-chap]::before{opacity:1}
body[data-chap="chapter-01-newton"]{--chapbg:url("../assets/img/portal/sm/earth.webp")}
body[data-chap="chapter-02-variational"]{--chapbg:url("../assets/img/portal/sm/moon.webp")}
body[data-chap="chapter-03-lagrangian"]{--chapbg:url("../assets/img/portal/sm/jupiter.webp")}
body[data-chap="chapter-04-oscillations"]{--chapbg:url("../assets/img/portal/sm/stars.webp")}
body[data-chap="chapter-05-rigid-body"]{--chapbg:url("../assets/img/portal/sm/mars.webp")}
body[data-chap="chapter-06-hamiltonian"]{--chapbg:url("../assets/img/portal/sm/sun.webp")}
body[data-chap="chapter-07-relativity"]{--chapbg:url("../assets/img/portal/sm/pillars.webp")}
/* 画框改为粒子簇：原 1px 金线撤掉，由 #frameFx 沿同一 inset 12px 圆角矩形绘制粒子簇（JS） */
html::after{content:"";display:none}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
/* 统一键盘焦点环：1.5px 金线、3px 外偏，在深玻璃上清晰可辨 */
.home-btn:focus-visible,.crumbs a:focus-visible,.icon-btn:focus-visible,.ri:focus-visible,
.search .s-clear:focus-visible,
#panel .p-links a:focus-visible,#notice .p-links a:focus-visible{
  outline:1.5px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px
}
#orb[role="button"]:focus{outline:none}
#orb[role="button"]:focus-visible{outline:none;filter:drop-shadow(0 0 1.5px color-mix(in srgb,var(--accent) 70%,transparent)) drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 55%,transparent))}
/* 环境光斑：随光球位置平移的软径向椭圆（等价于参考实现里对 --cx 的 1s 过渡） */
#glow{
  position:fixed;z-index:1;left:0;top:0;width:1200px;height:900px;pointer-events:none;
  background:radial-gradient(closest-side ellipse at 50% 50%,
    color-mix(in srgb, var(--accent) 20%, transparent) 0%,
    color-mix(in srgb, var(--accent) 11%, transparent) 34%,
    color-mix(in srgb, var(--accent) 5%, transparent) 56%,
    rgba(11,18,38,.18) 72%, transparent 86%);
  filter:blur(26px);opacity:.6;
  transform:translate3d(0,0,0);
  transition:transform var(--dur-4) var(--ease-io),opacity var(--dur-4) var(--ease-io);
  will-change:transform
}
body.view-module #glow{opacity:.85}
#stage{position:fixed;inset:0;overflow:hidden;z-index:2}
/* 连线电子云层：位于深空/章节底图之上、SVG 图谱与光球之下，因此不会盖住卡片文字 */
canvas#clouds{position:fixed;inset:0;z-index:1;pointer-events:none}
/* 页面边框粒子层：z3（与旧金线同级），整层不拦截点击 */
canvas#frameFx{position:fixed;inset:0;z-index:3;pointer-events:none}
svg#graph{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* 粒子吞吐层：位于 SVG 之上、顶栏/面板之下（二者在 #stage 外，z 层级更高），绝不拦截点击 */
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ===== 顶栏与面包屑 ===== */
.topbar{
  position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  padding:14px 22px;pointer-events:none;
}
.topbar>*{pointer-events:auto}
.home-btn{
  display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;
  flex:none;white-space:nowrap;   /* 窄屏不许被面包屑挤成竖排/裁切 */
  border:1px solid var(--line);background:rgba(8,13,28,.55);backdrop-filter:blur(10px);
  font-size:12.5px;color:var(--text-2);cursor:pointer;
  transition:border-color var(--dur-1),color var(--dur-1),transform var(--dur-1) var(--ease)
}
.home-btn:hover{border-color:var(--line-2);color:var(--text)}
.home-btn:active{transform:scale(.97)}
.home-btn b{color:var(--solar)}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);min-width:0}
.crumbs a{color:var(--text-2);padding:4px 8px;border-radius:8px;transition:background var(--dur-1),color var(--dur-1),transform var(--dur-1) var(--ease)}
.crumbs a:hover{background:rgba(146,182,255,.10);color:var(--text)}
.crumbs a:active{transform:scale(.97)}
.crumbs .sep{opacity:.6;color:var(--text-2)}
.crumbs .cur{color:var(--text);font-weight:600;max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.topbar .spacer{flex:1}
.search{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:rgba(8,13,28,.55);backdrop-filter:blur(10px);
  transition:border-color var(--dur-1),box-shadow var(--dur-1)
}
.search:focus-within{
  border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)
}
.search .sglyph{opacity:.65;flex:none}
.search input{
  width:190px;background:none;border:0;outline:none;color:var(--text);font:inherit;font-size:12.5px;
  transition:width var(--dur-2) var(--ease)
}
.search:focus-within input{width:230px}
.search input::placeholder{color:var(--muted)}
.search kbd{
  font-family:var(--font-mono);font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:0 5px
}
/* 清除按钮：有输入时浮现；结果计数徽标；零匹配时搜索框下方轻提示 */
.search .s-clear{
  width:18px;height:18px;flex:none;display:none;place-items:center;border:0;border-radius:50%;
  background:rgba(146,182,255,.14);color:var(--text-2);cursor:pointer;font-size:11px;line-height:1;padding:0;
  transition:background var(--dur-1),color var(--dur-1)
}
.search .s-clear.show{display:grid}
.search .s-clear:hover{background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--text)}
.search .s-count{
  flex:none;display:none;font-size:11px;color:var(--text-2);border:1px solid var(--line);border-radius:999px;
  padding:1px 8px;white-space:nowrap
}
.search .s-count.show{display:inline-block;animation:badgePop var(--dur-1) var(--ease)}
@keyframes badgePop{from{transform:scale(.85)}to{transform:scale(1)}}
#searchHint{
  position:fixed;z-index:29;right:22px;top:58px;display:none;
  font-size:11.5px;color:var(--muted);padding:5px 12px;border-radius:999px;
  border:1px dashed var(--line-2);background:rgba(8,13,28,.72);backdrop-filter:blur(10px)
}
#searchHint.show{display:block}

/* ===== 中心光球：460px 多层光晕（5.5s 呼吸，50% 处 scale 1.08）+ 亮核 ===== */
#orb{
  position:absolute;left:0;top:0;width:var(--halo-sz);height:var(--halo-sz);
  pointer-events:none;will-change:transform;
  transition:transform var(--dur-3) var(--ease)
}
#orb .haloWrap{
  position:absolute;inset:0;border-radius:50%;transform:scale(1);opacity:.95;
  transition:transform var(--dur-4) var(--ease-io),opacity var(--dur-4) var(--ease-io)
}
#orb .halo{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle closest-side at 50% 50%,
    color-mix(in srgb, var(--accent) 40%, transparent) 0%,
    color-mix(in srgb, var(--accent) 32%, transparent) 30%,
    color-mix(in srgb, var(--accent) 23%, transparent) 44%,
    color-mix(in srgb, var(--accent) 16%, transparent) 52%,
    color-mix(in srgb, var(--accent) 10%, transparent) 63%,
    color-mix(in srgb, var(--accent) 4.5%, transparent) 76%,
    color-mix(in srgb, var(--accent) 1.2%, transparent) 88%,
    transparent 100%);
  filter:blur(14px);
  animation:breathe 5.5s ease-in-out infinite
}
#orb .core{
  position:absolute;left:50%;top:50%;width:var(--core-sz);height:var(--core-sz);border-radius:50%;
  corner-shape:round;  /* 覆盖全站 superellipse：亮核必须是圆的，不能是圆角方 */
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle at 38% 34%, #f4f8ff 0%, var(--accent) 36%, rgba(0,0,0,0) 72%),
    radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) 60%, transparent) 0%, transparent 76%);
  filter:blur(.4px) saturate(1.15);
  box-shadow:0 0 60px color-mix(in srgb, var(--accent) 45%, transparent),
             0 0 160px color-mix(in srgb, var(--accent) 22%, transparent);
  transition:transform var(--dur-4) var(--ease-io),filter var(--dur-4) var(--ease-io),box-shadow var(--dur-4) var(--ease-io),opacity var(--dur-3) var(--ease-io)
}
#orb .core{pointer-events:auto;cursor:pointer}
/* 进章节可供性：悬停/聚焦时光晕外扩、星球增亮并沿球的 alpha 轮廓起大气外辉 */
#orb:hover .core{
  transform:translate(-50%,-50%) scale(1.05);
  box-shadow:0 0 78px color-mix(in srgb, var(--accent) 58%, transparent),
             0 0 200px color-mix(in srgb, var(--accent) 28%, transparent)
}
#orb:hover .orbtex{
  filter:saturate(1.18) contrast(1.06) brightness(1.12)
        drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 45%, transparent))
}
#orb:hover .label span{opacity:1;color:var(--text)}
body.narrow-mod #orb{opacity:0;pointer-events:none}
body.narrow-mod #glow{opacity:.30}
/* 星球贴图 canvas：球面渲染由 JS 逐像素完成（临边昏暗/晨昏线/大气都在画布内），
   这里只做合成——呼吸用独立 scale 属性（与 transform 合成，不被 view-module 的 scale 覆盖）；
   贴图首帧到达前透明（露出下面的渐变亮核回退），到达后淡入 */
#orb .orbtex{
  position:absolute;left:50%;top:50%;width:var(--core-sz);height:var(--core-sz);
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;
  filter:saturate(1.12) contrast(1.06);
  animation:planetBreath 8.4s var(--ease-io) infinite;
  transition:opacity var(--dur-3) var(--ease-io),filter var(--dur-2) var(--ease)
}
#orb .orbtex.live{opacity:1}
/* 贴图行星就位后收起方形亮核：行星本体 + 460px 光晕已足够，且避免亮核方底透出 */
#orb.textured .core{opacity:0!important;transition:none!important}
/* 行星环（土星）：前后两片画布夹住球体，环前半段压在星球上 */
#orb .orbring{
  position:absolute;left:50%;top:50%;width:calc(var(--core-sz)*2.13);height:calc(var(--core-sz)*2.13);
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  transition:opacity var(--dur-3) var(--ease-io),filter var(--dur-2) var(--ease)
}
#orb .orbring.live{opacity:1}
#orb:hover .orbring{filter:brightness(1.18)}
body.view-module #orb .orbring{transform:translate(-50%,-50%) scale(.82)}
@keyframes planetBreath{0%,100%{scale:1}50%{scale:1.022}}
#orb .label{
  position:absolute;left:50%;top:calc(50% + var(--core-sz)/2 + 26px);transform:translateX(-50%);
  white-space:nowrap;text-align:center
}
#orb .label b{display:block;font-size:16px;letter-spacing:.06em}
#orb .label span{display:block;font-size:12px;color:var(--text-2);margin-top:3px;opacity:.8}
body.view-module #orb .label{width:160px;white-space:normal;line-height:1.5;text-wrap:balance}
body.view-module #orb .label b{font-size:12px;text-wrap:balance}
/* 模块层：光晕放大渐隐（1.45 / .72），亮核收缩增辉；光球本体由 JS 平移让出伞面 */
body.view-module #orb .haloWrap{transform:scale(1.45);opacity:.72}
body.view-module #orb .core{
  transform:translate(-50%,-50%) scale(.82);
  filter:blur(.4px) saturate(1.2) brightness(1.18);
  box-shadow:0 0 84px color-mix(in srgb, var(--accent) 60%, transparent),
             0 0 220px color-mix(in srgb, var(--accent) 30%, transparent)
}
body.view-module #orb .orbtex{transform:translate(-50%,-50%) scale(.82)}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:.96}
  50%{transform:scale(1.08);opacity:.75}
}
/* ===== 实拍媒体层（vendor：media/，署名见 NOTICE.md；下层 CSS 渐变光球保留为回退） ===== */
/* 光球实拍视频：与光晕同尺寸，径向遮罩淡入深空，screen 混合 + 章节色相偏移 */
#orb .orbvid{
  position:absolute;left:0;top:0;width:var(--halo-sz);height:var(--halo-sz);
  border-radius:50%;object-fit:cover;opacity:0;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle closest-side,#000 55%,transparent 100%);
  mask-image:radial-gradient(circle closest-side,#000 55%,transparent 100%);
  mix-blend-mode:screen;
  filter:saturate(.35) brightness(.75) hue-rotate(var(--orb-hue,0deg));
  transition:opacity var(--dur-4) var(--ease-io)
}
/* 概览水母实拍层：位于 SVG 之上、非交互（点击仍落到伞盖），慢浮动错峰 */
#jellyLayer{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen}
#jellyLayer .jv{
  position:absolute;width:150px;height:112px;object-fit:cover;opacity:0;
  -webkit-mask-image:radial-gradient(ellipse 62% 64% at 50% 46%,#000 55%,transparent 100%);
  mask-image:radial-gradient(ellipse 62% 64% at 50% 46%,#000 55%,transparent 100%);
  transition:opacity var(--dur-3) var(--ease-io)
}
#jellyLayer .jv.live{opacity:.8}
@keyframes jfloat{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}

/* ===== SVG 图：神经丝（宽辉光 6px/.45 + 芯线 1.3px 圆帽）、水母、伞面节点 ===== */
#graph .th{transition:opacity var(--dur-3) var(--ease)}
/* 相邻高亮：悬停/聚焦某图元时，其余图元与连线降到 .3，自身及其连线保持全强度（~dur-2 过渡） */
#graph .node{transition:opacity var(--dur-2) var(--ease),scale var(--dur-1) var(--ease),filter var(--dur-1)}
#graph.focusing .node,#graph.focusing .th{opacity:.3}
#graph.focusing .node.hot,#graph.focusing .th.hot{opacity:1}
#graph .th.hot .tc,#graph .th.hot .fan-th{opacity:.95!important;stroke-width:1.6px}
/* 键盘焦点环（图元）：金色环 1.5px、3px 外偏；SVG 无 outline，用 drop-shadow 贴合形状 */
#graph g[role="button"]:focus{outline:none}
#graph g[role="button"]:focus-visible{outline:none;filter:drop-shadow(0 0 1.5px color-mix(in srgb,var(--accent) 70%,transparent)) drop-shadow(0 0 3px color-mix(in srgb,var(--accent) 60%,transparent))}
/* 按压反馈：用独立 scale 属性（与入场 finO 动画的 transform 各自独立、可复合），锚在自身中心 */
#graph .node:active,#graph .jelly:active{scale:.97;transform-box:fill-box;transform-origin:center}
#graph .node:active{filter:brightness(.85)}
#graph .tg{fill:none;stroke:currentColor;stroke-width:6;opacity:.45;filter:url(#threadBlur)}
#graph .tc{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;opacity:.9}
#graph .fan-th{fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;transition:stroke-width var(--dur-2),opacity var(--dur-2)}
#graph .jtent{fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;opacity:.4}
#graph .jelly{cursor:pointer;transition:filter var(--dur-2),scale var(--dur-1) var(--ease)}
#graph .jelly:hover{filter:brightness(1.35) drop-shadow(0 0 12px color-mix(in srgb, currentColor 40%, transparent))}
#graph .jelly .jbell{transition:stroke-opacity var(--dur-2)}
#graph .jelly.active .jbell{stroke-opacity:.9}
#graph .jelly .aring{fill:none;stroke:color-mix(in srgb, var(--solar) 80%, transparent);stroke-width:1.6;opacity:0;transition:opacity var(--dur-2)}
#graph .jelly.active .aring{opacity:1}
/* 模块玻璃标签卡：大号计数 + 名称 + 小副行；边框悬停用模块色、激活用金色 */
#graph .jcard{cursor:pointer}
/* 卡片本体没有矩形底/描边：柔光椭圆（淡出到 0）+ 周界粒子簇围出轮廓；点击由透明命中矩形承担 */
#graph .jcard.active{scale:1.055;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 9px color-mix(in srgb,currentColor 50%,transparent))}
#graph .jcard .cparts{opacity:.95;transition:opacity var(--dur-2)}
#graph .jcard:hover .cparts,#graph .jcard.active .cparts{opacity:1}
#graph .jcard .ccount,#graph .jcard .cname,#graph .jcard .csub{paint-order:stroke;stroke:rgba(4,8,18,.82);stroke-width:2.8px;stroke-linejoin:round}
#graph .jcard .csub{stroke-width:2.4px}
#graph .jcard .ccount{fill:var(--text);font-size:23px;font-weight:700;font-family:var(--font-mono)}
#graph .jcard .cname{fill:currentColor;font-size:12.5px;font-weight:600}
#graph .jcard .csub{fill:var(--muted);font-size:10.5px}
/* 伞面内容节点：9px 点 + 3px 半透明环 + 外辉光；悬停/选中现玻璃底；标签最多两行 */
#graph .node{cursor:pointer}
#graph .node .nhalo{transition:opacity var(--dur-2)}
#graph .node .nring{transition:stroke-opacity var(--dur-2)}
#graph .node .nbg{fill:url(#cardGlow);stroke:none;opacity:0;transition:opacity var(--dur-1);pointer-events:none}
#graph .node.sel .nbg{fill:url(#cardGlow);stroke:none}
/* 标签可读性：深色 3px 描边先画在填充之下（paint-order），压住 4K 深空底图 */
#graph .node text{font-family:var(--font-ui);font-size:13px;fill:var(--text-2);transition:fill var(--dur-1);
  paint-order:stroke;stroke:rgba(4,7,15,.92);stroke-width:3px;stroke-linejoin:round}
#graph .node:hover .nbg,#graph .node.sel .nbg{opacity:1}
#graph .node:hover text,#graph .node.sel text{fill:var(--text)}
#graph .node.sel .nring{stroke-opacity:.85}
#graph .node.sel .nhalo{opacity:.9}
#graph .planet{cursor:pointer;transition:filter var(--dur-2),scale var(--dur-1) var(--ease)}
#graph .planet:hover{filter:brightness(1.3) drop-shadow(0 0 10px color-mix(in srgb, currentColor 55%, transparent))}
/* 入场：伞面条目依次“长出来”（reduced-motion 下关闭） */
#graph .fin{animation:finIn .5s var(--ease) both;transform-box:fill-box;transform-origin:center}
#graph .finO{animation:finO .6s var(--ease-io) both;transform-box:fill-box;transform-origin:center}
@keyframes finIn{from{transform:scale(.72)}to{transform:scale(1)}}
@keyframes finO{from{transform:scale(.72)}to{transform:scale(1)}}

/* ===== 模块交融：章内连线(.xlink) / 跨章药丸(.xpill) / 着陆跨章网(.llink/.landbadge) =====
   纯静态 SVG（无逐帧动画）；高亮复用 .focusing/.hot 变暗模式；颜色取 linkTypes 令牌 */
#graph .xl{pointer-events:none}
#graph .xlink{fill:none;stroke-linecap:round;stroke-width:1.2;opacity:.3;
  transition:opacity var(--dur-2) var(--ease),stroke-width var(--dur-2)}
#graph.focusing .xlink{opacity:.08}
#graph.focusing .xlink.hot{opacity:.9;stroke-width:2}
#graph .llink{fill:none;stroke:#d7b48a;stroke-linecap:round;stroke-dasharray:none}
#graph .landbadge text{font-size:11px;fill:var(--text)}
#graph .landbadge rect{fill:rgba(8,13,28,.78);stroke:rgba(215,180,138,.5)}
#graph .lllegend text{font-size:11px;fill:var(--muted)}
/* 跨章药丸：玻璃胶囊 + 类型色描边/圆点（非卡片装饰边，是可跳转链接控件本体） */
#graph .xpill{cursor:pointer}
#graph .xpill rect{fill:rgba(8,13,28,.72);stroke-width:1.25;transition:fill var(--dur-1)}
#graph .xpill circle{filter:drop-shadow(0 0 3px currentColor)}
#graph .xpill text{font-size:11px;fill:var(--text-2);
  paint-order:stroke;stroke:rgba(4,7,15,.9);stroke-width:2.4px;stroke-linejoin:round;transition:fill var(--dur-1)}
#graph .xpill:hover rect,#graph .xpill.hot rect{fill:rgba(14,22,42,.92)}
#graph .xpill:hover text,#graph .xpill.hot text{fill:var(--text)}
#graph g[role="button"]:focus,#graph g[role="link"]:focus{outline:none}
#graph g[role="button"]:focus-visible,#graph g[role="link"]:focus-visible{
  outline:none;filter:drop-shadow(0 0 1.5px color-mix(in srgb,var(--accent) 70%,transparent)) drop-shadow(0 0 3px color-mix(in srgb,var(--accent) 60%,transparent))}

/* ===== 右侧详情面板 ===== */
#panel{
  position:fixed;z-index:40;top:0;right:0;height:100%;width:min(430px,92vw);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(10,16,32,.92),rgba(6,10,22,.96));
  border-left:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.15);
  transform:translateX(100%);transition:transform var(--dur-3) var(--ease);
  box-shadow:-24px 0 64px rgba(0,0,0,.45), inset 0 1px 0 rgba(176,206,255,.07)
}
#panel.open{transform:translateX(0)}
/* i18n 语言切换器（tm-lang--fixed, z-120）原盖住面板右上 ✕：面板打开时左移让位。
   仅桌面生效；窄屏面板为底部抽屉，与右上角旗标无冲突。 */
@media (min-width:901px){
  #panel.open ~ #tm-lang.tm-lang--fixed{right:calc(min(430px,92vw) + 16px);transition:right var(--dur-3) var(--ease)}
}
#panel .p-head{
  padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start
}
#panel .p-head .t{flex:1;min-width:0}
#panel .p-kicker{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#panel h2{margin:6px 0 0;font-size:17px;line-height:1.25;font-weight:650}
#panel h2:focus{outline:none}
#panel h2:focus-visible{outline:1.5px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px;border-radius:4px}
#panel .p-body{padding:18px 20px 26px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#2a3760 transparent}
#panel .p-body::-webkit-scrollbar{width:7px}
#panel .p-body::-webkit-scrollbar-thumb{background:#2a3760;border-radius:4px}
#panel .chunk{
  border:1px solid var(--line);border-radius:var(--radius-sm);
  background:rgba(10,16,32,.55);padding:12px 14px;margin:0 0 16px;
  font-size:13px;line-height:1.85;color:#cfe0ff;overflow-x:auto
}
#panel .chunk p{margin:.5em 0;overflow-wrap:anywhere;word-break:break-word}
#panel .chunk mjx-container[jax="SVG"][display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden}
#panel .chunk mjx-container[jax="SVG"][display="true"] > svg{height:auto}
#panel .chunk{padding-bottom:14px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;overflow-x:hidden}
/* 面板出口链接：统一药丸形（10px 圆角 + 悬停上浮），按压回落 */
#panel .p-links,#notice .p-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
#panel .p-links a,#notice .p-links a{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;
  border:1px solid var(--line);font-size:12.5px;color:var(--text-2);
  transition:border-color var(--dur-1),color var(--dur-1),background var(--dur-1),transform var(--dur-1) var(--ease)
}
#panel .p-links a:hover,#notice .p-links a:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--text);background:rgba(146,182,255,.08);transform:translateY(-1px)}
#panel .p-links a:active,#notice .p-links a:active{transform:scale(.97)}
#panel .p-links a.primary{border-color:color-mix(in srgb, var(--accent) 45%, transparent);color:var(--accent)}
/* 交融区块（同题异法）：类型圆点徽标 + 题名 + 全文注解 + 跳转按钮 */
#panel .p-xsec{margin:6px 0 2px}
#panel .p-xhead{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 10px}
#panel .xlink-item{border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(10,16,32,.55);padding:11px 13px;margin:0 0 10px}
#panel .xlink-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
#panel .xlink-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2);white-space:nowrap}
#panel .xlink-badge i{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 8px currentColor}
#panel .xlink-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.45}
#panel .xlink-note{margin:7px 0 0;font-size:12.5px;line-height:1.8;color:var(--text-2)}
#panel .xlink-go{margin-top:9px;padding:6px 11px;border-radius:10px;border:1px solid var(--line);
  background:rgba(10,16,32,.6);color:var(--text-2);font:inherit;font-size:12.5px;cursor:pointer;
  transition:border-color var(--dur-1),color var(--dur-1),background var(--dur-1),transform var(--dur-1) var(--ease)}
#panel .xlink-go:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--text);background:rgba(146,182,255,.08)}
#panel .xlink-go:active{transform:scale(.97)}
#panel .xlink-go:focus-visible{outline:1.5px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px}
.icon-btn{
  width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:9px;
  border:1px solid var(--line);background:rgba(10,16,32,.6);cursor:pointer;color:var(--text-2);
  transition:border-color var(--dur-1),color var(--dur-1),transform var(--dur-1) var(--ease)
}
.icon-btn:hover{border-color:var(--line-2);color:var(--text)}
.icon-btn:active{transform:scale(.94)}

/* ===== 模块/节点列表（节点多时的查找与浏览） ===== */
#rail{
  position:fixed;z-index:25;left:16px;top:74px;bottom:16px;width:250px;
  display:flex;flex-direction:column;gap:10px;pointer-events:none
}
#rail>*{pointer-events:auto}
#rail .rail-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  backdrop-filter:blur(12px);overflow:hidden;display:flex;flex-direction:column;min-height:0;
  box-shadow:0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(176,206,255,.06)
}
#rail h3{margin:0;padding:12px 14px 8px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:600;transition:color var(--dur-2)}
/* 分组内含选中项时，标题挂一条 2px 章节色竖标（:has 不支持则优雅跳过） */
#rail .rail-card:has(> .rail-list .ri.sel) h3{box-shadow:inset 2px 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
#rail .rail-list{overflow-y:auto;padding:0 8px 10px;scrollbar-width:thin;scrollbar-color:#2a3760 transparent}
#rail .rail-stage{margin:10px 4px 4px;padding:0 6px;font-size:12px;letter-spacing:.08em;color:color-mix(in srgb,var(--accent) 78%,var(--text-2));font-weight:600}
#rail .rail-stage:first-child{margin-top:2px}
#rail .rail-list::-webkit-scrollbar{width:7px}
#rail .rail-list::-webkit-scrollbar-thumb{background:#2a3760;border-radius:4px}
#rail .ri{
  display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid transparent;
  background:none;cursor:pointer;font-size:13px;color:var(--text-2);line-height:1.45;
  transition:background var(--dur-1),color var(--dur-1),transform var(--dur-1) var(--ease)
}
#rail .ri:hover{background:rgba(146,182,255,.08);color:var(--text)}
#rail .ri:active{transform:scale(.97);background:rgba(146,182,255,.14)}
#rail .ri.sel{background:color-mix(in srgb, var(--accent) 14%, transparent);border-color:color-mix(in srgb, var(--accent) 35%, transparent);border-left:2px solid var(--accent);color:var(--text)}
#rail .ri small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#rail .ri.empty{cursor:default;color:var(--muted)}

/* ===== 状态卡片（空/错误/加载） ===== */
#notice{
  position:fixed;z-index:35;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(460px,90vw);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;backdrop-filter:blur(14px) saturate(1.15);display:none;
  box-shadow:0 8px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(176,206,255,.07)
}
#notice.show{display:block}
#notice h2{margin:0 0 8px;font-size:17px;line-height:1.25;font-weight:650}
#notice p{margin:0 0 14px;color:var(--text-2);font-size:13px;line-height:1.7}

/* ===== 移动端：抽屉式详情 ===== */
@media (max-width:900px){
  :root{--halo-sz:250px;--core-sz:88px}
  /* 顶栏在窄屏要遮住从下面滚过去的节点标签：实底 + 底边渐隐 */
  .topbar{
    background:linear-gradient(to bottom, rgba(6,10,22,.97) 0%, rgba(6,10,22,.95) 68%, rgba(6,10,22,0) 100%);
    backdrop-filter:blur(10px);
    gap:8px;padding:10px 12px;padding-right:24px;align-items:flex-start
  }
  .topbar .home-btn{padding:5px 9px;gap:5px;font-size:11.5px}
  .crumbs{font-size:11.5px;gap:4px}
  .crumbs a{padding:3px 5px}
  .search{display:none}
  #searchHint{display:none!important}
  #rail{display:none}
  #panel{
    top:auto;bottom:0;right:0;left:0;width:100%;height:auto;max-height:72vh;
    border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(100%)
  }
  #panel.open{transform:translateY(0)}
  #panel.open::before{content:'';position:absolute;left:0;right:0;top:-30px;height:30px;pointer-events:none;
    background:linear-gradient(to top, rgba(6,10,22,.92), rgba(6,10,22,0))}
  #panel .p-head{padding-right:64px}
  #panel .grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:4px;border-radius:2px;background:var(--line-2)}
  .crumbs .cur{max-width:100%}
  #orb .label{top:calc(50% + var(--core-sz)/2 + 14px)}
  body.view-module #orb .haloWrap{transform:scale(1.2);opacity:.66}
}
/* 极窄屏：按钮再收一档；首段面包屑与左侧「返回太阳系」按钮重复，省掉它把宽度留给正文链 */
@media (max-width:520px){
  .topbar .home-btn{padding:4px 8px;font-size:11px}
  #crumbs > *:nth-child(1),#crumbs > *:nth-child(2){display:none}
}
/* 360~375px 宽的电话：面包屑首行会顶到右上角语言按钮下面，多留一点右白 */
@media (max-width:380px){
  .topbar{padding-right:40px}
}
@media (prefers-reduced-motion:reduce){
  canvas#fx{display:none}
  #orb .halo{animation:none}
  #graph .fin,#graph .finO{animation:none}
  .search .s-count{animation:none!important}
  #orb .orbvid,#jellyLayer .jv{animation:none!important;transition:none!important}
  #orb .orbtex{animation:none!important}
  #panel,#orb,#orb .haloWrap,#orb .core,#orb .orbtex,#orb .orbvid,#jellyLayer .jv,#glow,#graph *{transition:none!important}
  .search,.search input,.search .s-clear,.search .s-count,#rail .ri,#rail h3,.home-btn,.crumbs a,.icon-btn,
  #panel .p-links a,#notice .p-links a,#searchHint{transition:none!important}
}

<script>
(function(){
'use strict';
var D = window.TM_NEURAL || {chapters:[],modules:{}};
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var MEDIA_ON = !reduce;   /* 视频层接管水母/光球视觉时，不再绘制原 SVG 版本，避免重影 */
var $ = function(id){ return document.getElementById(id); };
var svgNS = 'http'+'://www.w3.org/2000/svg';

/* ---------- 状态 ---------- */
var state = { chapter:null, module:null, node:null, selected:null, preview:null };
var route = { chap:null, mod:null, node:null };
var SEL_KEY = 'tm-neural-selected';
function readStoredSel(){
  try {
    var raw = localStorage.getItem(SEL_KEY);
    if(!raw) return null;
    var v = JSON.parse(raw);
    return (v && v.chap && v.mx) ? v : null;
  } catch(e){ return null; }
}
function storeSel(mx){
  if(!state.chapter || !mx) return;
  try { localStorage.setItem(SEL_KEY, JSON.stringify({ chap: state.chapter.slug, mx: mx, at: Date.now() })); } catch(e){}
}
function markCardsSelected(mx){
  var cards = document.querySelectorAll('#gBells .jcard');
  for(var i=0;i<cards.length;i++) cards[i].classList.toggle('active', cards[i].getAttribute('data-mx') === mx);
}
function syncStoredSel(){
  var s = readStoredSel();
  if(!s) return;
  var ch = chapterBySlug(s.chap);
  if(!ch || ch.modules.indexOf(s.mx) < 0 || state.module) return;
  if(!state.chapter || state.chapter.slug !== s.chap) return;
  if(state.selected === s.mx) return;
  state.selected = s.mx;
  markCardsSelected(s.mx);
  if(state.preview){ state.preview = moduleOf(s.mx); if(state.preview) renderPanel(); }
}

function chapterBySlug(slug){ for(var i=0;i<D.chapters.length;i++) if(D.chapters[i].slug===slug) return D.chapters[i]; return null; }
function chapterIndex(ch){ return D.chapters.indexOf(ch); }
function moduleOf(mid){ return D.modules[mid] || null; }
function simHref(mod){ var h = '../' + mod.href; return mod.id === 'M12' ? h + '?mx=M12' : h; }
function sectionOf(mod, name){ if(!mod) return null; for(var i=0;i<mod.sections.length;i++) if(mod.sections[i].name===name) return mod.sections[i]; return null; }
function chunkOf(mod, id){
  if(!mod) return null;
  for(var i=0;i<mod.sections.length;i++){
    var s=mod.sections[i];
    for(var j=0;j<s.chunks.length;j++) if(s.chunks[j].id===id) return {section:s, chunk:s.chunks[j]};
  }
  return null;
}

/* ---------- 路由（hash：兼容 GitHub Pages 子路径，刷新/前进后退一致） ---------- */
function parseHash(){

  if(location.hash !== h){ history.pushState(null,'',h); applyRoute(); }   /* pushState 不触发 hashchange，须手动同步 */

    var tgt = SLUG_REDIRECT[route.chap];
    if(route.mod){ var own = ownerChapterOf(route.mod.toUpperCase()); if(own) tgt = own.slug; }
    writeHash(tgt, route.mod, route.node, true);

  }

  if(route.chap && !ch){ clearJellies(); showNotice('找不到这颗行星', '链接里的行星 ID「'+route.chap+'」不存在，可能是旧链接或输入有误。', [{t:'返回太阳系', href:'../index.html'}, {t:'看看行星列表', href:'#/'}]); fxRouteFx(); return; }
  hideNotice();

}
/* 路由火花：进入模块/点选节点时光球→节点方向的行军粒子；进入章节时择机爆发 */
var lastFxKey = '\u0000-';

/* ---------- 数据/主题 ---------- */
function accentOf(ch){ return ch ? ch.color : '#7fe0ff'; }
/* 标签净化：去掉 $...$ 数学段（含两侧空格）、-- → —、压缩空白。
   仅用于展示性文字（节点标签/副题/列表/面包屑/kicker）；
   面板正文保留原始 LaTeX，交给 MathJax。 */
function cleanLabel(s){
  if(!s) return '';

    .replace(/\$[^$]*\$/g,' ')

/* hex → 色相（deg，无彩 → 0），用于把实拍素材色相旋转到章节色 */
function hueFromHex(hex){
  var h = String(hex||'').replace('#','');
  if(h.length===3) h=h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);
  var r=parseInt(h.substr(0,2),16)/255, g=parseInt(h.substr(2,2),16)/255, b=parseInt(h.substr(4,2),16)/255;
  if(isNaN(r)||isNaN(g)||isNaN(b)) return 0;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, hh=0;
  if(d>0){

/* ---------- 原生星空（#bg 单画布，本页自绘，零外部依赖） ----------
   手法提炼自「星月夜」星空层的星层部分（仅密度/正弦闪烁/漂移回绕/DPR 上限，
   不含涡旋、流星、视差）：远 160 + 近 90 ≈ 250 颗；远景 r .25–.55、alpha .30–.70、
   慢闪烁（±.12）+ ≤2px/min 漂移取模回绕；近景 r .6–1.2、alpha .45–.85、快闪烁（±.18）。

   resize 重排画布并重播种（250 点全量重排成本可忽略）。 */
var bg = $('bg'), bctx = bg ? bg.getContext('2d') : null;

function bgSeed(){
  bgStars.length = 0;
  var i;
  for(i=0;i<BG_FAR_N;i++) bgStars.push({
    x:Math.random()*bgW, y:Math.random()*bgH, r:bgRand(0.25,0.55),
    base:bgRand(0.30,0.70), amp:0.12, tw:bgRand(0.00012,0.00045), ph:bgRand(0,6.2832),
    dx:bgRand(-0.00034,0.00034), dy:bgRand(-0.00034,0.00034), col:'#cfd8ee'
  });
  for(i=0;i<BG_NEAR_N;i++) bgStars.push({
    x:Math.random()*bgW, y:Math.random()*bgH, r:bgRand(0.6,1.2),
    base:bgRand(0.45,0.85), amp:0.18, tw:bgRand(0.0006,0.0016), ph:bgRand(0,6.2832),
    dx:0, dy:0, col:'#eef2ff'

    else{
      x = ((s.x + s.dx*t) % bgW + bgW) % bgW;
      y = ((s.y + s.dy*t) % bgH + bgH) % bgH;

  bctx.setTransform(d, 0, 0, d, 0, 0);

}
function bgLoop(now){
  bgRaf = window.requestAnimationFrame(bgLoop);
  if(now - bgLast < 33) return;         /* ~30fps 节流：闪烁观感足够，功耗减半 */
  bgLast = now;

function bgStop(){ if(bgRaf!==null){ window.cancelAnimationFrame(bgRaf); bgRaf=null; } }

  if(!bctx) return;                     /* 无 2d 上下文：只留 body 深空底色，干净退出 */

}
initBg();

/* 预烘焙各一张（换章节色时重烘一次）：32px 软点（白核+accent 辉光）、脉冲环 */
function bakeFx(acc){

  var c = s.getContext('2d');
  var g = c.createRadialGradient(SPRH,SPRH,0,SPRH,SPRH,SPRH);
  g.addColorStop(0,   'rgba(255,255,255,0.95)');
  g.addColorStop(0.26,'rgba(255,255,255,0.55)');
  g.addColorStop(0.34, acc);
  g.addColorStop(0.70, hexA(acc,0.22));

    g2.addColorStop(0,    'rgba(255,255,255,0)');
    g2.addColorStop(0.82, 'rgba(255,255,255,0)');
    g2.addColorStop(0.90, 'rgba(255,255,255,0.75)');
    g2.addColorStop(0.94, 'rgba(255,255,255,0.26)');
    g2.addColorStop(1,    'rgba(255,255,255,0)');

function fxIntake(){

  var ang = Math.random()*6.2832, dist = 320+Math.random()*240;
  p.k=0; p.ang=ang; p.d0=dist;
  p.x=orbPos.x+Math.cos(ang)*dist; p.y=orbPos.y+Math.sin(ang)*dist;
  p.vx=Math.cos(ang+1.5708)*(5+Math.random()*12); p.vy=Math.sin(ang+1.5708)*(5+Math.random()*12);

function fxBurst(){
  var n = 18+((Math.random()*9)|0); if(fxMobile) n=8+((Math.random()*5)|0);
  for(var i=0;i<n;i++){
    var p = fxBuy(); if(!p) break;
    var ang = Math.random()*6.2832, sp = 120+Math.random()*140;
    p.k=1;
    p.x=orbPos.x+Math.cos(ang)*orbR; p.y=orbPos.y+Math.sin(ang)*orbR;
    p.vx=Math.cos(ang)*sp; p.vy=Math.sin(ang)*sp;
    p.drag=1.7+Math.random()*0.7;
    p.r0=0.8+Math.random()*1.8; p.r=p.r0;
    p.a0=0.3+Math.random()*0.55;
    p.age=0; p.life=1.4+Math.random()*1.1;

    var rr=null;

/* 路由火花：光球 → 节点方向 10–14 粒直线行军，恰在到达前消散 */
function fxSparks(tx, ty){
  var dx=tx-orbPos.x, dy=ty-orbPos.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
  var ux=dx/dist, uy=dy/dist, px=-uy, py=ux;

  for(var i=0;i<n;i++){

    var sp = 170+Math.random()*90, side=(Math.random()-0.5)*16;
    p.k=2;
    p.x=orbPos.x+ux*(orbR+Math.random()*22)+px*side;
    p.y=orbPos.y+uy*(orbR+Math.random()*22)+py*side;
    p.vx=ux*sp+px*(side*0.9); p.vy=uy*sp+py*(side*0.9); p.drag=0;
    p.r0=0.8+Math.random()*1.5; p.r=p.r0;
    p.a0=0.35+Math.random()*0.5;

/* k: 0 吸入 1 爆发 2 火花 3 rim 小闪光 */

      p.ang += vt/(d+60)*dt;
      p.x=orbPos.x+Math.cos(p.ang)*d;
      p.y=orbPos.y+Math.sin(p.ang)*d;
      p.vx*=0.985; p.vy*=0.985;
      p.r=p.r0*(1-0.62*u);
      if(u>=1){ p.k=3; p.age=0; p.life=0.16; p.r=p.r0*1.2; p.a0=Math.min(0.85,p.a0+0.2); }
    } else if(p.k===1){
      var f=Math.exp(-p.drag*dt); p.vx*=f; p.vy*=f;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.r=p.r0*(1-0.45*u);

    } else if(p.k===2){
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.r=p.r0*(1-0.4*u);
      if(u>=1){ fxKill(p); continue; }
    } else {
      if(u>=1){ fxKill(p); continue; }
    }

function fxInBlock(x,y){
  if(fxBlockR && x>fxBlockR.l && x<fxBlockR.r && y>fxBlockR.t && y<fxBlockR.b) return true;
  if(fxBlockL && x>fxBlockL.l && x<fxBlockL.r && y>fxBlockL.t && y<fxBlockL.b) return true;
  return false;
}
function fxDraw(){
  fctx.clearRect(0,0,fxW,fxH);
  if(!fxOn || reduce) return;
  fctx.globalCompositeOperation='lighter';
  for(var i=0;i<FXP_MAX;i++){
    var p=fxPool[i]; if(!p.live) continue;
    var u=p.age/p.life, a;
    if(p.k===3) a=0.55*(1-u);
    else a=p.a0*(p.k===0?(0.5+0.5*u):1);
    if(a>0.85) a=0.85;
    if(a<=0.02) continue;
    if(p.x<-10||p.x>fxW+10||p.y<-10||p.y>fxH+10) continue;
    if(fxInBlock(p.x,p.y)) continue;
    var d=p.r*4;
    fctx.globalAlpha=a;
    fctx.drawImage(spriteDot, p.x-d*0.5, p.y-d*0.5, d, d);
  }
  fctx.globalCompositeOperation='source-over';
  fctx.globalAlpha=1;
}
function fxFrames(dt){
  fxAcc += dt*(fxMobile?5:11);            /* 桌面 8–14/s，窄屏减半（5–7） */
  var guard=0;
  while(fxAcc>=1 && guard<30){ fxAcc-=1; guard++; if(fxLive<220) fxIntake(); }
}
function fxFadeAll(){
  for(var i=0;i<FXP_MAX;i++){ var p=fxPool[i]; if(p.live){ p.r*=Math.exp(-6*(1/60)); } }
}
function fxClearAll(){
  for(var i=0;i<FXP_MAX;i++){ if(fxPool[i].live) fxKill(fxPool[i]); }
  for(var j=0;j<fxRings.length;j++) fxRings[j].on=false;
  fxRingN=0; fxAcc=0;
  if(fxInitd) fctx.clearRect(0,0,fxW,fxH);
}
function fxFrame(t){
  if(!fxInitd) return;
  if(reduce){
    if(!fxCleared){ fctx.clearRect(0,0,fxW,fxH); fxCleared=true; }
    fxLastT=t; return;
  }
  fxCleared=false;
  if(!fxRun){ fxLastT=t; return; }        /* 页面隐藏：暂停 */
  var dt=(t-fxLastT)/1000; fxLastT=t;
  if(!(dt>0)) dt=0.016;
  if(dt>0.05) dt=0.05;
  fxT+=dt;
  if(fxOn){ fxFrames(dt); fxUpdate(dt); }
  else if(fxLive){ fxFadeAll(); fxUpdate(dt); }
  fxDraw();
}

/* ---------- 连线电子云（章节概览 / 模块视图 两级共用） ----------
   每条连线 = 沿三次贝塞尔分布的一簇发光粒子：3 个聚簇 + 高斯横向扩散 +
   各自缓慢漂浮/闪烁；绘制在 #clouds（z1，SVG 图谱与光球之下），
   因此卡片文字不受影响。悬停项 α 提升，聚焦时其余项变暗。 */
var cloudCv = $('clouds'), cctx = cloudCv ? cloudCv.getContext('2d') : null;
var cloudW = 0, cloudH = 0, linkClouds = [], cloudSprites = {};
function cloudRnd(seed){
  var a = seed|0;
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    var t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function resizeClouds(){
  if(!cctx) return;
  var w = window.innerWidth, h = window.innerHeight;
  var d = Math.min(1.25, window.devicePixelRatio||1);
  cloudW = w; cloudH = h;
  cloudCv.width = Math.max(1, Math.round(w*d));
  cloudCv.height = Math.max(1, Math.round(h*d));
  cloudCv.style.width = w+'px'; cloudCv.style.height = h+'px';
  cctx.setTransform(d,0,0,d,0,0);
}
function cloudSprite(color){
  if(cloudSprites[color]) return cloudSprites[color];
  var s = document.createElement('canvas'); s.width=SPR; s.height=SPR;
  var g = s.getContext('2d');
  var rg = g.createRadialGradient(SPRH,SPRH,0,SPRH,SPRH,SPRH);
  rg.addColorStop(0,   'rgba(255,255,255,.92)');
  rg.addColorStop(0.24,'rgba(255,255,255,.52)');
  rg.addColorStop(0.40, hexA(color,.90));
  rg.addColorStop(0.74, hexA(color,.22));
  rg.addColorStop(1,    hexA(color,0));
  g.fillStyle = rg; g.fillRect(0,0,SPR,SPR);
  cloudSprites[color] = s;
  return s;
}
/* 注册一条电子云连线；返回 {g,color,p,parts}，g 只作为 hover/focus 状态载体 */
function cloudLink(color){
  var g = el('g',{'class':'th'});
  g.style.color = color;
  var rec = {g:g, color:color, p:[0,0,0,0,0,0,0,0], parts:[],
             born:performance.now(), seed:((Math.random()*1e9)|0), dim:false};
  var rr = cloudRnd(rec.seed);
  var n = (window.innerWidth<=900) ? 56 : 96;
  var clumps = [];
  for(var c=0;c<3;c++) clumps.push(0.13 + 0.74*rr());
  for(var i=0;i<n;i++){
    var u;
    if(rr() < 0.50) u = clumps[(rr()*3)|0] + (rr()+rr()+rr()-1.5)*0.14;  /* 聚簇 */
    else u = rr();                                                        /* 弥散底噪 */
    if(u < 0.035) u = 0.035; if(u > 0.965) u = 0.965;
    var gs = (rr()+rr()+rr()-1.5)/1.5;                                    /* ≈高斯 [-1,1] */
    rec.parts.push({
      u:u, off:gs*(3.4 + 8.2*Math.sin(Math.PI*u)),
      r:1.0 + rr()*2.6, a:0.20 + rr()*0.50,
      ph:rr()*6.283, ph2:rr()*6.283, ph3:rr()*6.283,
      ua:0.004 + rr()*0.011, fa:0.6 + rr()*1.5
    });
  }
  /* 云雾底：12 个大而淡的光斑，让连线有"云体"而不只是点 */
  for(var mi=0;mi<14;mi++){
    rec.parts.push({
      u:0.06 + 0.88*rr(), off:(rr()+rr()+rr()-1.5)*6.5,
      r:12 + rr()*18, a:0.060 + rr()*0.075,
      ph:rr()*6.283, ph2:rr()*6.283, ph3:rr()*6.283,
      ua:0.002 + rr()*0.005, fa:1.4 + rr()*1.2
    });
  }
  linkClouds.push(rec);
  return rec;
}
function drawClouds(t){
  if(!cctx) return;
  cctx.clearRect(0,0,cloudW,cloudH);
  if(!linkClouds.length) return;
  var now = reduce ? 0 : t;
  var focusing = gGraph.classList.contains('focusing');
  cctx.globalCompositeOperation = 'lighter';
  for(var ci=0;ci<linkClouds.length;ci++){
    var L = linkClouds[ci], P = L.p, parts = L.parts;
    var hot = L.g.classList.contains('hot');
    var am = hot ? 1.55 : 1;
    if(L.dim && !hot) am *= 0.32;
    if(focusing) am *= hot ? 1.10 : 0.30;
    var ramp = 1;   /* 粒子云随视图一起出现；不做入场淡入，避免后台节流时长时间停在低透明度 */
    var spr = cloudSprite(L.color);
    for(var i=0;i<parts.length;i++){
      var q = parts[i];
      var u = q.u + q.ua*Math.sin(now*0.00042 + q.ph);
      if(u < 0.02) u = 0.02; if(u > 0.98) u = 0.98;
      var m = 1-u, a0=m*m*m, b0=3*m*m*u, c0=3*m*u*u, d0=u*u*u;
      var x = a0*P[0] + b0*P[2] + c0*P[4] + d0*P[6];
      var y = a0*P[1] + b0*P[3] + c0*P[5] + d0*P[7];
      var tx = 3*m*m*(P[2]-P[0]) + 6*m*u*(P[4]-P[2]) + 3*u*u*(P[6]-P[4]);
      var ty = 3*m*m*(P[3]-P[1]) + 6*m*u*(P[5]-P[3]) + 3*u*u*(P[7]-P[5]);
      var tl = Math.sqrt(tx*tx+ty*ty)||1, nx = -ty/tl, ny = tx/tl;
      var off = q.off + q.fa*Math.sin(now*0.00055 + q.ph2);
      var px = x + nx*off, py = y + ny*off;
      if(px < -24 || px > cloudW+24 || py < -24 || py > cloudH+24) continue;
      var al = q.a * am * ramp * (0.72 + 0.28*Math.sin(now*0.0011 + q.ph3));
      if(al <= 0.015) continue;
      var dd = q.r*4;
      cctx.globalAlpha = al > 0.8 ? 0.8 : al;
      cctx.drawImage(spr, px-dd*0.5, py-dd*0.5, dd, dd);
    }
  }
  cctx.globalCompositeOperation = 'source-over';
  cctx.globalAlpha = 1;
}

/* ---------- 页面边框：粒子簇（替代原 1px 金线画框） ----------
   沿 inset 12px / 圆角 14 的矩形周长成簇分布发光粒子 + 云雾底；
   整层 pointer-events:none，不影响页面任何点击。 */
var frameCv = $('frameFx'), frameCtx = frameCv ? frameCv.getContext('2d') : null;

var frameW = 0, frameH = 0, frameParts = [];
function perimSegs(x0, y0, x1, y1, r){
  var q = Math.PI*r/2;
  var segs = [], top = Math.max(0, x1-x0-2*r), side = Math.max(0, y1-y0-2*r);
  function L(x,y,nx,ny,tx,ty,len){ segs.push({t:0,x:x,y:y,nx:nx,ny:ny,tx:tx,ty:ty,len:len}); }
  function A(cx,cy,a0,a1){ segs.push({t:1,cx:cx,cy:cy,r:r,a0:a0,a1:a1,len:q}); }
  L(x0+r, y0, 0,-1, 1,0, top);
  A(x1-r, y0+r, -Math.PI/2, 0);
  L(x1, y0+r, 1,0, 0,1, side);
  A(x1-r, y1-r, 0, Math.PI/2);
  L(x1-r, y1, 0,1, -1,0, top);
  A(x0+r, y1-r, Math.PI/2, Math.PI);
  L(x0, y1-r, -1,0, 0,-1, side);
  A(x0+r, y0+r, Math.PI, 1.5*Math.PI);

  for(var k=0;k<segs.length;k++) total += segs[k].len;
  return {segs:segs, total:total};
}
function frameSegs(w,h){ return perimSegs(12, 12, w-12, h-12, 14); }
function perimAt(P, s){
  s = ((s % P.total) + P.total) % P.total;
  for(var k=0;k<P.segs.length;k++){
    var g = P.segs[k];
    if(s <= g.len || k === P.segs.length-1){
      var u = g.len ? s/g.len : 0; if(u > 1) u = 1;
      if(g.t === 0){
        return {x:g.x+g.tx*g.len*u, y:g.y+g.ty*g.len*u, nx:g.nx, ny:g.ny, tx:g.tx, ty:g.ty};
      }
      var a = g.a0 + (g.a1-g.a0)*u;
      return {x:g.cx+Math.cos(a)*g.r, y:g.cy+Math.sin(a)*g.r,
              nx:Math.cos(a), ny:Math.sin(a), tx:-Math.sin(a), ty:Math.cos(a)};
    }
    s -= g.len;
  }

}
function resizeFrame(){
  if(!frameCtx || !FRAME_FX_ON) return;
  var w = window.innerWidth, h = window.innerHeight;
  var d = Math.min(1.25, window.devicePixelRatio||1);
  frameW = w; frameH = h;
  frameCv.width = Math.max(1, Math.round(w*d));

  frameCv.style.width = w+'px'; frameCv.style.height = h+'px';
  frameCtx.setTransform(d,0,0,d,0,0);
  var P = frameSegs(w,h), per = P.total;
  var M = Math.max(70, Math.round(per/24));
  frameParts = [];
  for(var k=0;k<M;k++){
    var s = (k+0.5)/M*per + (Math.random()-0.5)*(per/M)*0.9;
    var qm = perimAt(P,s);
    var spread = 6 + Math.random()*11, np = 2 + ((Math.random()*4)|0);
    for(var j=0;j<np;j++){
      var pt = perimAt(P, s + (Math.random()-0.5)*spread);
      frameParts.push({
        x:pt.x, y:pt.y, nx:pt.nx, ny:pt.ny, tx:pt.tx, ty:pt.ty,
        off:(Math.random()+Math.random()+Math.random()-1.5)*2.0,
        r:0.7 + Math.random()*1.7, a:0.18 + Math.random()*0.40,
        ph:Math.random()*6.283, ph2:Math.random()*6.283,
        fa:0.5 + Math.random()*1.4, ua:0.004 + Math.random()*0.010
      });
    }
    frameParts.push({
      x:qm.x, y:qm.y, nx:qm.nx, ny:qm.ny, tx:qm.tx, ty:qm.ty,
      off:(Math.random()-0.5)*2, r:6 + Math.random()*10, a:0.030 + Math.random()*0.050,
      ph:Math.random()*6.283, ph2:Math.random()*6.283,

function drawFrame(t){
  if(!frameCtx) return;

  if(!frameParts.length) return;
  var spr = cloudSprite(accentOf(state.chapter));
  var now = reduce ? 0 : t;
  frameCtx.globalCompositeOperation = 'lighter';
  for(var i=0;i<frameParts.length;i++){
    var p = frameParts[i];
    var off = p.off + p.fa*Math.sin(now*0.0005 + p.ph);
    var along = p.ua*Math.sin(now*0.0004 + p.ph2);
    var x = p.x + p.nx*off + p.tx*along, y = p.y + p.ny*off + p.ty*along;
    var a = p.a*(0.72 + 0.28*Math.sin(now*0.0011 + p.ph2));

    var dd = p.r*4;

/* 星球贴图：真球面正交投影（Canvas 2D 逐像素，零依赖、零外部素材请求）。

   所以"每像素的初始经度"可预计算，每帧只做一遍取色+着色的轻量循环（≈10 万像素）。
   光照：视向固定的主光（左上、略偏前 ⇒ 3/4 相位），柔和晨昏线 + 临边昏暗 +
   临边大气辉光 + 盘外大气环全部预计算；背光面压到 --horizon 基调而非纯黑，

}
/* 节点按标签所需宽度分列；行高不足时滚动画布，避免压缩命中区域。 */
/* 阅读结构：把 TM_STRUCT 的阶段方案套到模块小节上（该模块无方案时保持原序） */
function orderedOf(mod){
  if(mod.__ordered) return mod.__ordered;
  var plan = (window.TM_STRUCT && TM_STRUCT.modules) ? TM_STRUCT.modules[mod.id] : null;
  var secs = mod.sections.slice(), labelOf = {}, stages = [];
  if(plan && plan.stages && plan.stages.length){
    var seen = {}, next = [];
    plan.stages.forEach(function(st){
      var order = st.order || [];
      for(var i=0;i<order.length;i++){
        var s = mod.sections[order[i]-1];
        if(!s || seen[order[i]]) continue;
        seen[order[i]] = 1;
        next.push(s);
        if(st.label) labelOf[s.name] = st.label;
      }
      if(st.label && stages.indexOf(st.label)<0) stages.push(st.label);
    });
    for(var k=0;k<mod.sections.length;k++){ if(!seen[k+1]) next.push(mod.sections[k]); }
    if(next.length === mod.sections.length) secs = next;
  }
  mod.__ordered = {secs: secs, labelOf: labelOf, stages: stages};
  return mod.__ordered;
}
function renderModule(ch, mod){
  clearGraph(); clearJellies();
  var s = stageSize();
  var secs = orderedOf(mod).secs;
  orbLabel(mod.id + ' · ' + cleanLabel(mod.title), secs.length + ' 个节点');
  if(!secs.length){
    var t = el('text',{x:orbPos.x+220, y:orbPos.y+140, 'text-anchor':'middle', fill:'#a9b8dc', 'font-size':'13px'});
    t.textContent = '这个模块还没有可展示的节点';
    gNodes.appendChild(t); return;
  }
  var narrow = s.w <= 900;
  var ox = orbPos.x, oy = orbPos.y, pos = [];
  var leftEdge = narrow ? 22 : s.railW + 190;
  var rightEdge = narrow ? s.w - 18 : s.w - s.panelW - 28;
  var available = rightEdge - leftEdge;
  if(!narrow && available < 190){
    leftEdge = s.railW + 28;
    available = rightEdge - leftEdge;
    placeOrb(s.railW + (s.w-s.railW-s.panelW)/2, 148);
    ox = orbPos.x; oy = orbPos.y;
  }
  var cols = Math.min(2, secs.length, Math.max(1, Math.floor(available/155)));
  var rows = Math.ceil(secs.length/cols);
  var colW = Math.min(available/cols, 320);
  var maxChars = Math.max(8, Math.min(24, Math.floor((colW-38)/13)));
  /* 窄屏顶栏会随面包屑换行变高，首行基线取实测下沿，避免标签被压住 */
  var headB = 0, headEl = document.querySelector('.topbar');
  if(headEl) headB = headEl.getBoundingClientRect().bottom || 0;
  var bandTop = narrow ? Math.max(112, headB+20) : (available < 350 ? 268 : 108);
  var bandBot = Math.max(s.h-88, bandTop+(rows-1)*58);
  /* 行距封顶：节点少的模块不再把几行拉满整屏，整块在可用带内居中（窄屏贴顶） */
  var fsL = 13, lhL = 17, maxLines = 1;
  for(var ln=0; ln<secs.length; ln++){
    var nL = labelLines(pad2(ln+1)+' \u00b7 '+cleanLabel(secs[ln].name), maxChars).length;
    if(nL>maxLines) maxLines = nL;
  }
  var pitchCap = Math.max(narrow?64:72, maxLines*lhL+(narrow?26:34));
  var evenPitch = rows>1 ? (bandBot-bandTop)/(rows-1) : 0;
  var pitch = rows>1 ? Math.min(evenPitch, pitchCap) : 0;
  var spanY = (rows-1)*pitch;
  var top = narrow ? bandTop : bandTop + Math.max(0, (bandBot-bandTop-spanY)/2);
  var x0 = leftEdge + Math.max(0, (available-colW*cols)/2);
  var contentH = Math.max(s.h, top+spanY+(narrow ? 220 : 76));
  $('graph').style.height = contentH+'px';
  $('stage').style.overflowY = contentH>s.h ? 'auto' : 'hidden';
  for(var k=0;k<secs.length;k++){
    var col = Math.floor(k/rows), row = k%rows;
    pos.push({x:x0+col*colW, y:top+row*pitch, above:false, left:true, ring:col});
  }
  /* 路由火花坐标：节点 → 屏幕位置（fx 系统读取） */
  nodeHit = [];
  for(var z=0;z<pos.length;z++) nodeHit.push({x:pos[z].x, y:pos[z].y});
  /* 两行标签与命中区域使用同一列宽和基线。 */
  var metas = [];
  for(var m1=0;m1<secs.length;m1++){
    var p1 = pos[m1];
    var fs1 = 13, lineH1 = 17;
    var anchor1 = 'start';
    var lx1 = p1.x+16;
    var ly1 = p1.y+4;
    var lines1 = labelLines(pad2(m1+1)+' \u00b7 '+cleanLabel(secs[m1].name), maxChars);
    var bw1=0;
    for(var l1=0;l1<lines1.length;l1++){ bw1 = Math.max(bw1, textW(lines1[l1], fs1)); }
    var bx1 = (anchor1==='middle') ? lx1-bw1/2-9 : (anchor1==='start' ? lx1-8 : lx1-bw1-8);
    metas.push({fs:fs1, lineH:lineH1, anchor:anchor1, lx:lx1, ly:ly1, lines:lines1,
      bx:bx1, boxW:bw1+18, boxH:lineH1*(lines1.length-1)+fs1+14, arc:p1.ring});
  }
  /* ---- 第二遍：绘制；窄屏另加独立透明命中rect（≥44px，视觉盒 .nbg 不变） ---- */
  for(var q=0;q<secs.length;q++){
    var sec = secs[q], p = pos[q], M = metas[q];
    var disp = pad2(q+1)+' \u00b7 '+cleanLabel(sec.name);   /* 展示名：01 · 净化标签 */
    var hot = !!(state.node && state.node.section === sec);
    var dim = !!state.node && !hot;
    var th = cloudLink(mod.color);
    th.dim = dim;
    if(hot) th.g.classList.add('hot');
    var c1x, c1y, c2x, c2y;
    if(narrow){ c1x=ox+(p.x-ox)*0.25; c1y=oy+56; c2x=p.x-(p.x-ox)*0.30; c2y=p.y-(p.y-oy)*0.45; }
    else { c1x=ox+(p.x-ox)*0.40; c1y=oy; c2x=p.x-(p.x-ox)*0.35; c2y=p.y-(p.y-oy)*0.25; }
    (function(TH, qi, PP, C1X, C1Y, C2X, C2Y){
      var mkTh = function(t){
        var dx=PP.x-(ox+16), dy=PP.y-oy, L=Math.sqrt(dx*dx+dy*dy)||1;
        var nx=-dy/L, ny=dx/L;
        var k = reduce ? 0 : Math.sin(t*0.0005 + qi*1.7)*7;   /* 轻微漂浮 */
        return [ox+16, oy, C1X+nx*k, C1Y+ny*k, C2X+nx*k*0.6, C2Y+ny*k*0.6, PP.x, PP.y];
      };
      TH.p = mkTh(0);
      if(!reduce){ regAnim(function(t){ TH.p = mkTh(t); }); }
    })(th, q, p, c1x, c1y, c2x, c2y);
    gLinks.appendChild(th.g);
    regFin(th.g, 100+q*45);
    var g = el('g',{'class':'node'+(hot?' sel':'')});
    g.style.color = mod.color;
    var tt = el('title'); tt.textContent = sec.name; g.appendChild(tt);
    var box = el('rect',{'class':'nbg', x:M.bx, y:M.ly-M.fs-5, width:M.boxW, height:M.boxH, rx:9, ry:9});
    g.appendChild(box);
    var wrapped = wrapLabel(g, M.lx, M.ly, disp, maxChars, M.lineH, M.anchor, sec.name);
    wrapped.t.style.fontSize = M.fs+'px';
    g.appendChild(el('circle',{'class':'nhalo', cx:p.x, cy:p.y, r:10, fill:'currentColor', opacity: hot? .5 : .28}));
    g.appendChild(el('circle',{'class':'nring', cx:p.x, cy:p.y, r:6.5, fill:'none', stroke:'currentColor', 'stroke-opacity':.5, 'stroke-width':1.2}));
    g.appendChild(el('circle',{cx:p.x, cy:p.y, r:4.2, fill:'currentColor'}));
    g.appendChild(el('circle',{cx:p.x, cy:p.y, r:18, fill:'transparent'}));
    if(narrow){
      var hy0 = Math.min(p.y-18, M.ly-M.fs-5)-2;
      var hh0 = Math.max(p.y+18, M.ly-M.fs-5+M.boxH)+2 - hy0;
      if(hh0<44){ hy0=p.y-22; hh0=44; }
      var hx0 = Math.min(p.x-18, M.bx)-2, hx1 = Math.max(p.x+18, M.bx+M.boxW)+2;
      if(hx1-hx0<44){ if(p.left) hx1=hx0+44; else hx0=hx1-44; }
      g.appendChild(el('rect',{'class':'nhit', x:hx0, y:hy0, width:hx1-hx0, height:hh0, fill:'transparent'}));
    }
    (function(sc2, qi){
      g.addEventListener('click', function(){ noteOpener(g,'graph',qi); writeHash(ch.slug, mod.id.toLowerCase(), sc2.chunks[0].id); });
      g.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); noteOpener(g,'graph',qi); writeHash(ch.slug, mod.id.toLowerCase(), sc2.chunks[0].id); } });
    })(sec, q);
    setA11y(g, '知识节点 '+cleanLabel(sec.name)+'，按 Enter 打开详情');
    regFin(g, 140+q*55);
    regItem(g, th);
    gNodes.appendChild(g);
  }
}

    panel.classList.remove('open'); panel.setAttribute('aria-hidden','true');
    if(panelWas) restorePanelFocus();   /* 面板关闭：焦点回到触发打开的元素 */
  }
  syncStageInset();
}
/* 窄屏抽屉：舞台底边让出抽屉高度，节点不被盖上，超出部分在抽屉上方滚动 */
function syncStageInset(){
  var st = $('stage'), pn = $('panel');
  if(!st || !pn) return;
  var open = pn.classList.contains('open') && window.innerWidth<=900;
  st.style.bottom = open ? (pn.offsetHeight+'px') : '';
  if(open) st.style.overflowY = 'auto';
}
/* 焦点进出面板：#pTitle 是 tabindex=-1 的落点；lastOpener 记录触发者（重渲染后按 kind+idx 重新定位） */
function panelFocusIn(){
  var h = $('pTitle');
  if(h && h.focus) h.focus({preventScroll:true});
}
var lastOpener = null;
function noteOpener(el, kind, idx){ lastOpener = {el:el, kind:kind||'', idx:(idx==null?-1:idx)}; }
function restorePanelFocus(){
  if(!lastOpener) return;
  var t = document.contains(lastOpener.el) ? lastOpener.el : null;
  if(!t && lastOpener.idx>=0){
    var pool = document.querySelectorAll(lastOpener.kind==='rail' ? '#rail .ri' : '#gNodes > g,#gBells > g');
    t = pool[lastOpener.idx] || null;
  }
  if(t && t.focus) t.focus({preventScroll:true});
  lastOpener = null;
}
/* 笔记片段 → 可渲染文本：去掉 sub:/eq: 等交叉引用标记，未定界的公式行补上 \[…\] */
function joinMultilineInlineMath(raw){
  var lines = String(raw||'').split(/\r?\n/), out = [];
  for(var i=0;i<lines.length;i++){
    if(out.length && ((out[out.length-1].match(/\$/g)||[]).length % 2) === 1) out[out.length-1] += ' ' + lines[i];
    else out.push(lines[i]);
  }
  return out.join('\n');
}
function cleanRefs(s){
  var out = String(s || '');
  out = out.replace(/式\s*[（(]\s*[A-Za-z][A-Za-z0-9_.:\u2013\u2014\/-]*\s*[）)]/g, '该式');
  out = out.replace(/(将|把)该式\s*(?:与|和|及)\s*该式/g, '$1两式');
  out = out.replace(/方程\s*该式/g, '方程');
  out = out.replace(/该式\s*与\s*该式/g, '两式');
  out = out.replace(/\s*该式\s*/g, '该式');
  out = out.replace(/([\u4e00-\u9fff])\s+([\u4e00-\u9fff])/g, '$1$2');
  out = out.replace(/[ \t]{2,}/g, ' ');
  out = out.replace(/表\s+[a-z][a-z0-9_-]*/g, '下表');
  out = out.replace(/第\s+[a-z][a-z0-9_-]*\s+节/g, '本节');
  return out;
}
function fracify(s){
  var guard = 0;
  while(guard++ < 40){
    var hit = -1, closeP = -1, openQ = -1, closeQ = -1;
    for(var i=1;i<s.length-1;i++){
      if(s.charAt(i) === ')' && s.charAt(i+1) === '/' && s.charAt(i+2) === '('){
        var d1 = 0, p = i;
        for(; p >= 0; p--){ if(s.charAt(p) === ')') d1++; else if(s.charAt(p) === '('){ d1--; if(!d1) break; } }
        if(p < 0) continue;
        var d2 = 0, k = i + 2;
        for(; k < s.length; k++){ if(s.charAt(k) === '(') d2++; else if(s.charAt(k) === ')'){ d2--; if(!d2) break; } }
        if(k >= s.length) continue;
        hit = p; closeP = i; openQ = i + 2; closeQ = k;
        break;
      }
    }
    if(hit < 0) break;
    var num = s.slice(hit + 1, closeP), den = s.slice(openQ + 1, closeQ);
    s = s.slice(0, hit) + '\\frac{' + num + '}{' + den + '}' + s.slice(closeQ + 1);
  }
  return s;
}
function fracifyInline(ln){
  var held = [];
  var out = String(ln || '').replace(/\$\$[\s\S]+?\$\$/g, function(m){
    held.push('$$' + fracify(m.slice(2, -2)) + '$$');
    return '\u0001' + (held.length - 1) + '\u0001';
  });
  out = out.replace(/\$([^$]+)\$/g, function(m, inner){ return '$' + fracify(inner) + '$'; });
  out = out.replace(/\u0001(\d+)\u0001/g, function(m, i){ return held[+i]; });
  return out;
}
function formatChunkText(raw){
  var lines = joinMultilineInlineMath(raw).split(/\r?\n/);
  var out = [], buf = [];
  function braceDelta(s){
    var d = 0;
    for(var i=0;i<s.length;i++){
      var c = s.charAt(i);
      if(c === '\\'){ i++; continue; }
      if(c === '{') d++; else if(c === '}') d--;
    }
    return d;
  }
  function alignLongMath(s){
    if(s.length < 70 || s.indexOf('\\begin{') >= 0) return null;
    var parts = [], depth = 0, cur = '';
    for(var i=0;i<s.length;i++){
      var ch = s.charAt(i);
      if(ch === '{' || ch === '(' || ch === '[') depth++;
      else if(ch === '}' || ch === ')' || ch === ']') depth--;
      if(ch === '=' && depth <= 0){ parts.push(cur); cur = ''; continue; }
      cur += ch;
    }
    parts.push(cur);
    if(parts.length < 3) return null;
    var rows = [parts.shift() + '&=' + parts[0]];
    for(var k=1;k<parts.length;k++) rows.push('&=' + parts[k]);
    return '\\begin{aligned}' + rows.join('\\\\') + '\\end{aligned}';
  }
  function flushMath(){
    if(buf.length){
      var s = fracify(buf.join(' '));
      var d = braceDelta(s);
      while(d > 0){ s += '}'; d--; }
      out.push('\\[' + (alignLongMath(s) || s) + '\\]');
      buf = [];
    }
  }
  for(var i=0;i<lines.length;i++){
    var ln = lines[i];
    if(/^\s*(sub|sec|eq|fig|tab|app):[A-Za-z0-9_.:\-]+\s*$/.test(ln)) continue;      /* 纯标记行 */
    ln = ln.replace(/\\neq:[A-Za-z0-9_.:\-]+/g,'').replace(/\\(?:sub|sec|eq|fig|tab)ref\{[^}]*\}/g,'');
    ln = ln.replace(/\s+$/,'');
    if(!ln) { flushMath(); continue; }
    var hasCmd = /\\[A-Za-z]+/.test(ln);
    var wrapped = /\$[^$]*\$/.test(ln) || /\\\(.*\\\)/.test(ln);
    var mathOnly = !/[\u4e00-\u9fff]/.test(ln) && !/\$/.test(ln) && /[=^_]/.test(ln) && /^[A-Za-z0-9\\\s()[\]{}.,+\-*/^_<>=|!'\u2032\u2032]+$/.test(ln);
    var openBraces = buf.length ? braceDelta(buf.join(' ')) : 0;
    if(openBraces > 0 && !/[\u4e00-\u9fff]/.test(ln)){ buf.push(ln); continue; }         /* 上一条公式还没闭合：继续吃下一行 */
    if((hasCmd || mathOnly) && !wrapped){ buf.push(ln); continue; }                      /* 连续公式行合并成一段 */
    flushMath();
    out.push(fracifyInline(cleanRefs(ln)));
  }
  flushMath();
  return out.join('\n\n');
}
/* 兜底：MathJax 报错时该段退回纯文本（保留 LaTeX 原文，不再显示黄色报错块） */
function plainOf(raw){
  return formatChunkText(raw)
    .replace(/\\\[/g,'').replace(/\\\]/g,'')
    .replace(/\$/g,'')
    .replace(/\\\(/g,'').replace(/\\\)/g,'');
}
function guardMathFallback(body, rawText){
  var tries = 0;
  function check(){
    var t = body.textContent || '';
    if(/You can't use|Undefined control sequence|Missing \$|Extra \}/.test(t)){
      body.textContent = plainOf(rawText);
      return;
    }
    if(++tries < 24) setTimeout(check, 600);     /* MathJax 可能延后 10s 才吐错，持续观察 */
  }
  setTimeout(check, 600);
}
var mjxReady = null;
function ensureMathJax(){
  if(mjxReady) return mjxReady;
  mjxReady = new Promise(function(res){
    function done(){
      if(window.MathJax && window.MathJax.startup && window.MathJax.startup.promise){
        window.MathJax.startup.promise.then(function(){ res(); });
      } else {
        setTimeout(done, 120);
      }
    }
    if(window.MathJax && window.MathJax.startup && window.MathJax.startup.promise){ done(); return; }
    var s = document.createElement('script');
    s.src = '../assets/mathjax/tex-svg.js';
    s.async = true;
    s.onload = done;
    s.onerror = function(){ res(); };
    document.head.appendChild(s);
  });
  return mjxReady;
}
function typeset(node){
  ensureMathJax().then(function(){
    var target = document.getElementById('pBody') || node;
    var tries = 0;
    (function attempt(){
      var M = window.MathJax;
      if(!(M && M.typesetPromise && M.startup && M.startup.promise)) return;
      M.startup.promise.then(function(){ return M.typesetPromise([target]); }).then(function(){
        if(!target.querySelector('mjx-container') && target.textContent.trim() && ++tries < 40) setTimeout(attempt, 500);
      }).catch(function(){
        if(++tries < 40) setTimeout(attempt, 500);
      });
    })();
  });
}

/* ---------- 通知卡片 ---------- */
function showNotice(title, text, links){
  $('nTitle').textContent = title; $('nText').textContent = text;

  });

function hideNotice(){ $('notice').classList.remove('show'); }

/* ---------- 交互：Esc / 关闭 / 搜索 ---------- */
function closeDetail(){
  if(state.node){ writeHash(state.chapter.slug, state.module.id.toLowerCase()); return; }
  if(state.module){ writeHash(state.chapter.slug); return; }
}
function goUp(){
  if(state.node){ writeHash(state.chapter.slug, state.module.id.toLowerCase()); return; }
  if(state.module){ writeHash(state.chapter.slug); return; }
  if(state.chapter){ window.location.href='../index.html'; }
}
document.addEventListener('keydown', function(e){
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  var typing = tag==='INPUT' || tag==='TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable);
  if(e.key==='Escape'){
    if(typing){ document.activeElement.blur(); return; }
    if(state.chapter){ e.preventDefault(); goUp(); }
    return;
  }
  if(typing) return;
  if(e.key==='/' && !e.metaKey && !e.ctrlKey){
    var si=$('searchInput');
    if(si && si.offsetParent){ e.preventDefault(); si.focus(); si.select(); }
  }
});
$('pClose').addEventListener('click', closeDetail);
/* 搜索：右栏过滤 + 图节点实时变暗 + 计数徽标 + ✕ 清除 + 零匹配提示 */
function applySearch(){
  var si = $('searchInput');
  var q = (si.value||'').trim().toLowerCase();
  $('searchClear').classList.toggle('show', !!q);
  var items = document.querySelectorAll('#rail .ri:not(.empty)');
  var railHit = 0;
  for(var i=0;i<items.length;i++){
    var s=items[i].textContent.toLowerCase();
    var hitR = !q || s.indexOf(q)>=0;
    items[i].style.display = hitR ? '' : 'none';
    if(hitR) railHit++;
  }
  var ns = document.getElementById('graph').querySelectorAll('.node'), nodeCnt = 0;   /* 总览卡片在 gBells、模块/行星在 gNodes：从 svg 根统一查 */
  for(var j=0;j<ns.length;j++){
    var hitN = !q || ns[j].textContent.toLowerCase().indexOf(q)>=0;
    ns[j].style.opacity = hitN ? '' : '.18';
    if(hitN) nodeCnt++;
  }
  var badge = $('searchCount');
  if(q && ns.length){ badge.textContent = nodeCnt+' 个节点'; badge.classList.add('show'); }
  else badge.classList.remove('show');
  $('searchHint').classList.toggle('show', !!q && railHit===0 && nodeCnt===0);
}
$('searchInput').addEventListener('input', applySearch);
$('searchInput').addEventListener('keydown', function(e){
  if(e.key==='Escape'){ e.stopPropagation(); e.target.value=''; applySearch(); e.target.blur(); }   /* 场内 Esc：清空并失焦，不触发全局路由回退 */
});
$('searchClear').addEventListener('click', function(){
  var si=$('searchInput'); si.value=''; applySearch(); si.focus();
});

});

/* ---------- 主循环 ---------- */
function loop(t){
  var dt = orbLast ? Math.min(100, t-orbLast)/1000 : 0; orbLast = t;
  if(!reduce) orbSpin += ORB_SPIN_RATE*dt;
  if(!reduce || !loop._drawn){ drawOrbTexture(); loop._drawn = true; }
  runAnims(t);
  drawClouds(t);
  drawFrame(t);
  fxFrame(t);
  requestAnimationFrame(loop);
}

resizeFrame();
bakeFx('#7fe0ff'); fxAccBaked='#7fe0ff';

var mjxPrewarmed=false;
function prewarmMathJax(){ if(mjxPrewarmed) return; mjxPrewarmed=true; ensureMathJax(); }
['pointerdown','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, prewarmMathJax, {passive:true}); });

requestAnimationFrame(loop);
})();
