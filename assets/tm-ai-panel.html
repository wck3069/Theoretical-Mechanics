<style id="tm-ai-style">
#tm-ai-root{
  position:fixed; inset:0; z-index:60; pointer-events:none;
  font-family:ui-sans-serif,system-ui,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  --tmai-void:#03050c; --tmai-panel:rgba(9,14,30,.74); --tmai-line:rgba(146,182,255,.14);
  --tmai-text:#e8eeff; --tmai-text2:#a9b8dc; --tmai-muted:#6d7ca4;
  --tmai-solar:#ffd27a; --tmai-cyan:#7fe0ff; --tmai-violet:#b79bff;
}
#tm-ai-root *{box-sizing:border-box}
#tm-ai-root .tmai-launcher{
  position:fixed; right:18px; bottom:18px; height:54px; min-width:54px; padding:0 10px;
  display:flex; align-items:center; justify-content:center; gap:6px;
  border-radius:999px; cursor:pointer; pointer-events:auto;
  color:var(--tmai-text); font-size:13px; font-weight:600; letter-spacing:.3px;
  background:linear-gradient(160deg,rgba(26,36,66,.72),rgba(6,10,22,.88));
  border:1px solid rgba(146,182,255,.28);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(0,0,0,.45), 0 0 0 1px rgba(255,210,122,.12);
  transition:transform .15s ease, box-shadow .15s ease;
}
#tm-ai-root .tmai-launcher:hover{transform:translateY(-2px)}
#tm-ai-root .tmai-launcher::after{
  content:''; position:absolute; inset:-5px; border-radius:inherit;
  border:1px solid rgba(255,210,122,.32);
  animation:tmai-pulse 2.6s ease-out infinite; pointer-events:none;
}
@keyframes tmai-pulse{
  0%{transform:scale(1); opacity:.7}
  70%{transform:scale(1.22); opacity:0}
  100%{transform:scale(1.22); opacity:0}
}
#tm-ai-root .tmai-launcher-glyph{font-size:18px; color:var(--tmai-solar); line-height:1}
#tm-ai-root .tmai-launcher-short{display:none}
#tm-ai-root .tmai-launcher-full{display:none}
@media (min-width:561px){
  #tm-ai-root .tmai-launcher{padding:0 16px; min-width:150px}
  #tm-ai-root .tmai-launcher-glyph{display:none}
  #tm-ai-root .tmai-launcher-full{display:inline}
}
@media (max-width:979px){
  #tm-ai-root .tmai-launcher{bottom:190px}
}
@media (max-width:560px){
  #tm-ai-root .tmai-launcher{width:54px; padding:0; min-width:54px}
  #tm-ai-root .tmai-launcher-full{display:none}
  #tm-ai-root .tmai-launcher-glyph{display:inline}
}
#tm-ai-root .tmai-panel{
  position:fixed; right:18px; bottom:84px; width:380px;
  max-height:min(640px,78vh);
  display:flex; flex-direction:column;
  background:var(--tmai-panel);
  border:1px solid var(--tmai-line);
  border-radius:16px;
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,210,122,.06);
  overflow:hidden; pointer-events:auto;
  color:var(--tmai-text); font-size:14px;
}
#tm-ai-root .tmai-panel[hidden]{display:none !important}
@media (max-width:560px){
  #tm-ai-root .tmai-panel{
    left:10px; right:10px; width:auto; bottom:76px; max-height:76vh;
  }
}
#tm-ai-root .tmai-header{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; border-bottom:1px solid var(--tmai-line);
  background:linear-gradient(180deg,rgba(26,36,66,.35),transparent);
}
#tm-ai-root .tmai-title{font-size:15px; font-weight:650; color:var(--tmai-text); letter-spacing:.3px}
#tm-ai-root .tmai-header-left{display:flex; flex-direction:column; gap:4px}
#tm-ai-root .tmai-header-right{display:flex; align-items:center; gap:8px}
#tm-ai-root .tmai-status{display:flex; align-items:center; font-size:11.5px; color:var(--tmai-text2)}
#tm-ai-root .tmai-status-dot{width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--tmai-muted)}
#tm-ai-root .tmai-status-dot.tmai-status-checking{background:var(--tmai-muted)}
#tm-ai-root .tmai-status-dot.tmai-status-online{background:#7fe3a0; box-shadow:0 0 6px #7fe3a0}
#tm-ai-root .tmai-status-dot.tmai-status-offline{background:#ffc46b}
#tm-ai-root .tmai-status-dot.tmai-status-error{background:#ff8a8a}
#tm-ai-root .tmai-seg{display:inline-flex; border:1px solid var(--tmai-line); border-radius:999px; overflow:hidden}
#tm-ai-root .tmai-seg-btn{
  background:transparent; border:none; color:var(--tmai-text2); padding:4px 10px;
  font:inherit; font-size:12px; cursor:pointer; transition:.15s;
}
#tm-ai-root .tmai-seg-btn[aria-pressed="true"]{background:rgba(255,210,122,.14); color:var(--tmai-solar)}
#tm-ai-root .tmai-close{
  width:28px; height:28px; border-radius:50%; border:1px solid var(--tmai-line);
  background:rgba(6,10,22,.5); color:var(--tmai-text2); cursor:pointer; font-size:16px; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
#tm-ai-root .tmai-context{
  margin:10px 14px 0; padding:6px 10px; border-radius:999px;
  background:rgba(255,210,122,.10); border:1px solid rgba(255,210,122,.25);
  color:var(--tmai-solar); font-size:12px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
#tm-ai-root .tmai-context[hidden]{display:none !important}
#tm-ai-root .tmai-context button{background:transparent; border:none; color:var(--tmai-solar); cursor:pointer; font-size:14px}
#tm-ai-root .tmai-messages{
  flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;
  min-height:120px;
}
#tm-ai-root .tmai-messages::-webkit-scrollbar{width:6px}
#tm-ai-root .tmai-messages::-webkit-scrollbar-thumb{background:rgba(146,182,255,.2); border-radius:3px}
#tm-ai-root .tmai-msg{display:flex; flex-direction:column; max-width:92%}
#tm-ai-root .tmai-msg-user{align-self:flex-end; max-width:85%}
#tm-ai-root .tmai-msg-assistant{align-self:flex-start}
#tm-ai-root .tmai-msg-content{
  padding:8px 12px; border-radius:12px; font-size:14px; line-height:1.65;
  word-break:break-word;
}
#tm-ai-root .tmai-msg-user .tmai-msg-content{
  background:rgba(127,224,255,.12); border:1px solid rgba(127,224,255,.22);
  border-radius:12px 12px 4px 12px; color:var(--tmai-text);
}
#tm-ai-root .tmai-msg-assistant .tmai-msg-content{
  background:rgba(26,36,66,.5); border:1px solid var(--tmai-line);
  border-radius:12px 12px 12px 4px; color:var(--tmai-text);
}
#tm-ai-root .tmai-msg-content p{margin:0 0 8px}
#tm-ai-root .tmai-msg-content p:last-child{margin-bottom:0}
#tm-ai-root .tmai-msg-content ul{margin:4px 0 8px; padding-left:18px}
#tm-ai-root .tmai-msg-content li{margin:2px 0}
#tm-ai-root .tmai-msg-content code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
  background:rgba(146,182,255,.10); padding:1px 5px; border-radius:4px; color:var(--tmai-cyan);
}
#tm-ai-root .tmai-math{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--tmai-solar)}
#tm-ai-root .tmai-cite{
  display:inline-block; padding:0 .4em; margin:0 .15em; border-radius:4px;
  background:rgba(255,210,122,.12); color:var(--tmai-solar); font-size:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
#tm-ai-root .tmai-msg-label{
  margin-top:4px; font-size:11px; color:var(--tmai-muted); align-self:flex-start;
}
#tm-ai-root .tmai-typing{display:inline-flex; gap:4px; padding:2px 0}
#tm-ai-root .tmai-typing span{
  width:6px; height:6px; border-radius:50%; background:var(--tmai-text2);
  animation:tmai-blink 1.2s infinite;
}
#tm-ai-root .tmai-typing span:nth-child(2){animation-delay:.2s}
#tm-ai-root .tmai-typing span:nth-child(3){animation-delay:.4s}
@keyframes tmai-blink{0%,80%,100%{opacity:.3} 40%{opacity:1}}
#tm-ai-root .tmai-chips{display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 10px}
#tm-ai-root .tmai-chips[hidden]{display:none !important}
#tm-ai-root .tmai-chip{
  font:inherit; font-size:12px; padding:5px 10px; border-radius:999px; cursor:pointer;
  background:rgba(58,95,191,.14); border:1px solid rgba(146,182,255,.22); color:#cfdcff;
  transition:.15s; text-align:left;
}
#tm-ai-root .tmai-chip:hover{background:rgba(94,162,255,.24)}
#tm-ai-root .tmai-composer{
  display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--tmai-line);
  align-items:flex-end;
}
#tm-ai-root .tmai-composer textarea{
  flex:1; resize:none; min-height:40px; max-height:120px;
  background:rgba(6,10,22,.6); border:1px solid var(--tmai-line); border-radius:10px;
  color:var(--tmai-text); font:inherit; font-size:14px; padding:8px 10px; line-height:1.5;
}
#tm-ai-root .tmai-composer textarea:focus-visible{outline:2px solid var(--tmai-cyan); outline-offset:1px}
#tm-ai-root .tmai-composer button{
  padding:0 14px; height:40px; border-radius:10px; border:1px solid #4f86ff;
  background:linear-gradient(180deg,#3f7bff,#2b5fe0); color:#fff; cursor:pointer; font-weight:600;
}
#tm-ai-root .tmai-composer button:disabled{opacity:.5; cursor:not-allowed}
#tm-ai-root .tmai-footer{
  padding:6px 14px 10px; font-size:11.5px; color:var(--tmai-muted); text-align:center;
}
#tm-ai-root .tmai-sources{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
#tm-ai-root .tmai-src{
  font-size:11px; padding:2px 8px; border-radius:999px; text-decoration:none;
  border:1px solid rgba(146,182,255,.22); color:var(--tmai-text2);
}
#tm-ai-root .tmai-src:hover{color:var(--tmai-text); border-color:rgba(146,182,255,.4)}
#tm-ai-root .tmai-src-pdf{border-color:rgba(255,210,122,.3); color:var(--tmai-solar)}
#tm-ai-root .tmai-list{margin:4px 0 8px; padding-left:18px}
@media (prefers-reduced-motion:reduce){
  #tm-ai-root .tmai-launcher::after{animation:none}
  #tm-ai-root .tmai-typing span{animation:none; opacity:.6}
}
</style>
<div id="tm-ai-root">
  <button id="tmai-launcher" class="tmai-launcher" type="button" aria-expanded="false" aria-label="打开问星助教">
    <span class="tmai-launcher-glyph" aria-hidden="true">✦</span>
    <span class="tmai-launcher-short">问星</span>
    <span class="tmai-launcher-full">✦ 问星 · 本地 AI 助教</span>
  </button>
  <div id="tmai-panel" class="tmai-panel" role="dialog" aria-modal="false" aria-labelledby="tmai-title" hidden>
    <div class="tmai-header">
      <div class="tmai-header-left">
        <span class="tmai-title" id="tmai-title">星语 · 讲义助教</span>
        <div class="tmai-status">
          <span class="tmai-status-dot" id="tmai-status-dot"></span>
          <span class="tmai-status-text" id="tmai-status-text">检查中…</span>
        </div>
      </div>
      <div class="tmai-header-right">
        <div class="tmai-seg" role="group" aria-label="模式">
          <button type="button" class="tmai-seg-btn" data-mode="quick" aria-pressed="true">快速</button>
          <button type="button" class="tmai-seg-btn" data-mode="deep" aria-pressed="false">深空</button>
        </div>
        <button type="button" class="tmai-close" aria-label="关闭">×</button>
      </div>
    </div>
    <div id="tmai-context" class="tmai-context" hidden>
      <span id="tmai-context-text"></span>
      <button type="button" id="tmai-context-close" aria-label="取消章节上下文">×</button>
    </div>
    <div id="tmai-messages" class="tmai-messages" aria-live="polite"></div>
    <div id="tmai-chips" class="tmai-chips"></div>
    <div class="tmai-composer">
      <textarea id="tmai-input" rows="2" placeholder="输入问题…" aria-label="输入问题"></textarea>
      <button id="tmai-send" type="button" aria-label="发送">发送</button>
    </div>
    <div class="tmai-footer">本地模型 · 问题不会离开这台机器<br>AI 可能出错，请以讲义推导（note.pdf）为准</div>
  </div>
</div>
<script id="tm-ai-js">
(function () {
  'use strict';

  var root = document.getElementById('tm-ai-root');
  if (!root) return;

  var launcher = document.getElementById('tmai-launcher');
  var panel = document.getElementById('tmai-panel');
  var statusDot = document.getElementById('tmai-status-dot');
  var statusText = document.getElementById('tmai-status-text');
  var messagesEl = document.getElementById('tmai-messages');
  var chipsEl = document.getElementById('tmai-chips');
  var inputEl = document.getElementById('tmai-input');
  var sendBtn = document.getElementById('tmai-send');
  var contextEl = document.getElementById('tmai-context');
  var contextText = document.getElementById('tmai-context-text');
  var contextClose = document.getElementById('tmai-context-close');
  var segBtns = root.querySelectorAll('.tmai-seg-btn');
  var closeBtn = root.querySelector('.tmai-close');

  var isOpen = false;
  var inFlight = false;
  var mode = 'quick';
  var healthChecked = false;
  var statusState = 'checking';
  var modelName = '';
  var moduleContext = null;
  var conversation = [];
  var typingEl = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatInline(s) {
    var out = s;
    out = out.replace(/\$([^$]+)\$/g, '<span class="tmai-math">$1</span>');
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\[(M\d+)\]/g, '<span class="tmai-cite">[$1]</span>');
    return out;
  }

  function formatBlock(block) {
    var lines = block.split('\n');
    var hasList = lines.some(function (l) {
      var t = l.trim();
      return t.indexOf('- ') === 0 || t.indexOf('* ') === 0;
    });
    var isList = hasList && lines.every(function (l) {
      var t = l.trim();
      return t === '' || t.indexOf('- ') === 0 || t.indexOf('* ') === 0;
    });
    if (isList) {
      var items = lines.filter(function (l) { return l.trim() !== ''; }).map(function (l) {
        var t = l.trim().replace(/^[-*]\s*/, '');
        return '<li>' + formatInline(t) + '</li>';
      });
      return '<ul class="tmai-list">' + items.join('') + '</ul>';
    }
    return '<p>' + lines.map(function (l) { return formatInline(l); }).join('<br>') + '</p>';
  }

  function formatContent(text) {
    return String(text == null ? '' : text).split(/\n{2,}/).map(formatBlock).join('');
  }

  function setStatus(state, model) {
    statusState = state;
    if (model) modelName = model;
    if (statusDot) {
      statusDot.className = 'tmai-status-dot tmai-status-' + state;
    }
    if (statusText) {
      if (state === 'checking') statusText.textContent = '检查中…';
      else if (state === 'online') statusText.textContent = '本地模型在线 · ' + (modelName || 'model');
      else if (state === 'offline') statusText.textContent = '离线 · 本地检索模式';
      else if (state === 'error') statusText.textContent = '连接错误';
    }
  }

  function getModules() {
    if (window.TM_MODULES && Array.isArray(window.TM_MODULES)) return window.TM_MODULES;
    return null;
  }

  function findModule(milestone) {
    var mods = getModules();
    if (!mods) return null;
    for (var i = 0; i < mods.length; i++) {
      if (mods[i].milestone === milestone) return mods[i];
    }
    return null;
  }

  function setContext(moduleId) {
    moduleContext = moduleId;
    var title = moduleId;
    var m = findModule(moduleId);
    if (m && m.title) title = m.title;
    if (contextText) contextText.textContent = '当前章节 ' + moduleId + ' · ' + title;
    if (contextEl) contextEl.hidden = false;
  }

  function clearContext() {
    moduleContext = null;
    if (contextEl) contextEl.hidden = true;
  }

  function cjkBigrams(str) {
    var out = [];
    var s = String(str == null ? '' : str);
    for (var i = 0; i < s.length - 1; i++) {
      var a = s.charAt(i);
      var b = s.charAt(i + 1);
      if (/[\u4e00-\u9fff]/.test(a) && /[\u4e00-\u9fff]/.test(b)) {
        out.push(a + b);
      }
    }
    return out;
  }

  function latinTokens(str) {
    return String(str == null ? '' : str).toLowerCase().split(/[^a-z0-9]+/).filter(function (t) { return t.length > 0; });
  }

  function localAnswer(question) {
    var mods = getModules();
    if (!mods) {
      return { answer: '当前为离线检索模式（未连接教室 AI 服务器）。讲义正文与 PDF 仍可正常使用；需要 AI 答疑时请联系老师开启教室服务器。', sources: [] };
    }
    var qBigrams = cjkBigrams(question);
    var qTokens = latinTokens(question);
    var scored = mods.map(function (m) {
      var corpus = [m.title, m.tags, m.src, m.summary, m.note].join(' ');
      var cBigrams = cjkBigrams(corpus);
      var cTokens = latinTokens(corpus);
      var score = 0;
      qBigrams.forEach(function (bg) {
        if (cBigrams.indexOf(bg) !== -1) score += 2;
      });
      qTokens.forEach(function (tk) {
        if (cTokens.indexOf(tk) !== -1) score += 3;
      });
      var titleBigrams = cjkBigrams(m.title || '');
      qBigrams.forEach(function (bg) {
        if (titleBigrams.indexOf(bg) !== -1) score += 2;
      });
      return { m: m, score: score };
    });
    scored.sort(function (a, b) { return b.score - a.score; });
    var top = scored.filter(function (x) { return x.score > 0; }).slice(0, 3);
    if (top.length === 0) top = scored.slice(0, 2);
    if (top.length > 3) top = top.slice(0, 3);
    var lines = top.map(function (x, i) {
      var m = x.m;
      var desc = m.summary || m.src || '';
      return (i + 1) + '. ' + m.milestone + ' · ' + m.title + (desc ? '：' + desc : '');
    });
    var answer = '离线检索结果（讲义相关章节）：\n\n' + lines.join('\n');
    var sources = top.map(function (x) {
      var m = x.m;
      return { milestone: m.milestone, title: m.title, section: m.title, href: m.sim, pdf: m.note };
    });
    return { answer: answer, sources: sources };
  }

  function renderSources(container, sources) {
    if (!sources || !sources.length) return;
    var seen = {};
    var wrap = document.createElement('div');
    wrap.className = 'tmai-sources';
    var count = 0;
    for (var i = 0; i < sources.length && count < 5; i++) {
      var s = sources[i];
      var href = s.href || s.sim || '';
      var key = href;
      if (key && seen[key]) continue;
      if (key) seen[key] = true;
      if (href) {
        var a = document.createElement('a');
        a.className = 'tmai-src';
        a.href = href;
        a.textContent = (s.milestone ? s.milestone + ' · ' : '') + (s.section || s.title || '');
        wrap.appendChild(a);
        count++;
      }
      if (s.pdf && count < 5) {
        var pdfKey = s.pdf;
        if (!seen[pdfKey]) {
          seen[pdfKey] = true;
          var p = document.createElement('a');
          p.className = 'tmai-src tmai-src-pdf';
          p.href = s.pdf;
          p.textContent = 'PDF';
          wrap.appendChild(p);
          count++;
        }
      }
    }
    if (wrap.childNodes.length) container.appendChild(wrap);
  }

  function appendMessage(msg) {
    var el = document.createElement('div');
    el.className = 'tmai-msg tmai-msg-' + (msg.role === 'user' ? 'user' : 'assistant');
    var content = document.createElement('div');
    content.className = 'tmai-msg-content';
    if (msg.typing) {
      content.innerHTML = '<span class="tmai-typing"><span></span><span></span><span></span></span>';
    } else {
      content.innerHTML = formatContent(msg.content);
    }
    el.appendChild(content);
    if (msg.label) {
      var badge = document.createElement('div');
      badge.className = 'tmai-msg-label';
      badge.textContent = msg.label;
      el.appendChild(badge);
    }
    if (msg.sources && msg.sources.length) {
      renderSources(el, msg.sources);
    }
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function removeTyping() {
    if (typingEl && typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
    typingEl = null;
  }

  function openPanel() {
    if (isOpen) return;
    isOpen = true;
    panel.hidden = false;
    launcher.setAttribute('aria-expanded', 'true');
    if (!healthChecked) {
      healthChecked = true;
      if (location.protocol === 'file:') {
        setStatus('offline');
      } else {
        setStatus('checking');
        fetch('/api/health').then(function (res) {
          if (!res.ok) throw new Error('bad');
          return res.json();
        }).then(function (data) {
          if (data && data.ok && data.upstream) {
            setStatus('online', data.model);
          } else {
            setStatus('offline');
          }
        }).catch(function () {
          setStatus('offline');
        });
      }
    }
    setTimeout(function () { try { inputEl.focus(); } catch (e) {} }, 50);
  }

  function closePanel() {
    if (!isOpen) return;
    isOpen = false;
    panel.hidden = true;
    launcher.setAttribute('aria-expanded', 'false');
  }

  function togglePanel() {
    if (isOpen) closePanel(); else openPanel();
  }

  function sendQuestion() {
    if (inFlight) return;
    var text = inputEl.value.trim();
    if (text === '') return;
    inFlight = true;
    sendBtn.disabled = true;
    appendMessage({ role: 'user', content: text });
    conversation.push({ role: 'user', content: text });
    inputEl.value = '';
    typingEl = appendMessage({ role: 'assistant', content: '', typing: true });
    var history = conversation.slice(-6);
    fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, module: moduleContext, mode: mode, history: history })
    }).then(function (res) {
      if (!res.ok) throw new Error('bad');
      return res.json();
    }).then(function (data) {
      removeTyping();
      var answer = (data && data.answer) ? data.answer : '';
      var sources = (data && data.sources) ? data.sources : [];
      appendMessage({ role: 'assistant', content: answer, sources: sources });
      conversation.push({ role: 'assistant', content: answer });
    }).catch(function () {
      removeTyping();
      var la = localAnswer(text);
      appendMessage({ role: 'assistant', content: la.answer, sources: la.sources, label: '离线检索' });
      conversation.push({ role: 'assistant', content: la.answer });
    }).then(function () {
      inFlight = false;
      sendBtn.disabled = false;
    });
  }

  launcher.addEventListener('click', togglePanel);
  closeBtn.addEventListener('click', closePanel);
  sendBtn.addEventListener('click', sendQuestion);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      sendQuestion();
    }
    if (e.key === 'Escape') {
      closePanel();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isOpen) closePanel();
  });
  contextClose.addEventListener('click', clearContext);
  Array.prototype.forEach.call(segBtns, function (b) {
    b.addEventListener('click', function () {
      mode = b.getAttribute('data-mode');
      Array.prototype.forEach.call(segBtns, function (x) {
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
    });
  });

  var suggestions = [
    '什么是有效势？它为什么能判断圆轨道稳定性？',
    '伯特兰定理说明了什么？',
    '两体问题怎么化成单体问题？',
    '碰撞恢复系数在二维碰撞里怎么用？'
  ];
  suggestions.forEach(function (q) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'tmai-chip';
    chip.textContent = q;
    chip.addEventListener('click', function () {
      inputEl.value = q;
      sendQuestion();
      if (chipsEl) chipsEl.hidden = true;
    });
    chipsEl.appendChild(chip);
  });

  appendMessage({ role: 'assistant', content: '你好，我是星语——理论力学讲义助教。可以问我有效势、轨道稳定性、两体问题、碰撞恢复系数等。' });

  try {
    var params = new URLSearchParams(location.search);
    if (params.has('m')) setContext(params.get('m'));
  } catch (e) {}

  try {
    var params2 = new URLSearchParams(location.search);
    if (params2.get('ask') === '1') {
      setTimeout(openPanel, 300);
    }
  } catch (e2) {}

  window.TM_AI = {
    open: function (opts) {
      if (opts && opts.module) setContext(opts.module);
      openPanel();
    },
    close: closePanel,
    toggle: togglePanel
  };

  document.addEventListener('tm:open-ai', function (e) {
    var opts = e && e.detail ? e.detail : null;
    if (opts && opts.module) setContext(opts.module);
    openPanel();
  });
})();
</script>
