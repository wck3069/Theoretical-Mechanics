name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install esprima
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: HTML structure and local-only assets
        run: >-
          python tools/check_html.py
          index.html catalog.html binet.html
          chapters/*/index.html chapters/*/manuscripts/*.html
          modules/*/index.html
      - name: Local links and assets
        run: python tools/check_links.py --root .
      - name: Knowledge base is up to date
        run: |
          python tools/build_kb.py --check
          python tools/build_offline_kb.py
          python tools/apply_seo.py
          git diff --exit-code
      - name: Module numeric self-tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python tools/verify_selftest.py
