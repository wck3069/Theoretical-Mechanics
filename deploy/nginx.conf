# /etc/nginx/conf.d/mechanics.conf
# 先：sudo htpasswd -c /etc/nginx/.htpasswd class
limit_req_zone $binary_remote_addr zone=tm_api:10m rate=15r/m;

server {
    listen 443 ssl http2;
    server_name mechanics.example.com;

    ssl_certificate     /etc/letsencrypt/live/mechanics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mechanics.example.com/privkey.pem;

    client_max_body_size 1m;

    location /api/ask {
        auth_basic "Theoretical Mechanics";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=tm_api burst=4 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        auth_basic "Theoretical Mechanics";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name mechanics.example.com;
    return 301 https://$host$request_uri;
}
